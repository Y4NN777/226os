name: Branch policy

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate branch promotion
    runs-on: ubuntu-latest
    steps:
      - name: Validate branch names and PR targets
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            if [[ "$BASE_REF" == "develop" ]]; then
              [[ "$HEAD_REF" =~ ^(feature|fix|hotfix|refactor|test|docs|chore)/[a-z0-9-]+/[a-z0-9-]+$ ]] || {
                echo "Invalid work branch: $HEAD_REF"
                exit 1
              }
            elif [[ "$BASE_REF" == "main" ]]; then
              [[ "$HEAD_REF" == "develop" || "$HEAD_REF" =~ ^hotfix/[a-z0-9-]+/[a-z0-9-]+$ ]] || {
                echo "Only develop or a hotfix branch may target main."
                exit 1
              }
            else
              echo "Unsupported PR target: $BASE_REF"
              exit 1
            fi
          else
            [[ "$REF_NAME" == "develop" || "$REF_NAME" == "main" ]] || {
              echo "This workflow only validates protected branch pushes."
              exit 1
            }
          fi

      - name: Check out the repository
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Every promotion leaves a merge commit that exists only on main. This step makes the back-merge
      # (main -> develop) impossible to forget: other work waits until it has landed.
      # See scripts/check-develop-contains-main.sh and docs/GIT_WORKFLOW.md (promotion flow, step 7).
      - name: Develop must contain main
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: scripts/check-develop-contains-main.sh
