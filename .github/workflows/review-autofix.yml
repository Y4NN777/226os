# Review auto-fix (stage 3): after the "Code review" workflow, when the review comment of a pull request into develop
# has an OPEN finding of MEDIUM or HIGH (not a note; an open CRITICAL goes to the owner instead), Claude Code fixes
# those findings on the pull request's head branch with .claude/commands/review-fix.md, as a normal project session
# (CLAUDE.md, .claude/settings.json hooks, .claude/agents and .claude/skills load: the action's default setting sources
# are user, project and local). Its commits are checked and pushed by this workflow, which re-triggers CI and the review.
#
# Every decision is scripts/review-autofix.py (from the default branch, never from the pull request):
#   job decide  `pr`: same-repository branches only (never a fork, never main or develop), only when the review job
#               really ran for the current head, at most 2 attempts per pull request (labels autofix-1, autofix-2,
#               written before the fix runs); the third is refused and labelled needs-owner.
#   job fix     Claude Code (pinned like code-review.yml) commits as the owner's human identity; `check` (a trusted copy
#               outside the workspace) refuses another identity, an AI trailer and owner paths (contract, migrations,
#               ADRs, secrets, .github, the harness); then a fresh repository pushes the commits normally (never force)
#               with REVIEW_BOT_TOKEN. A push with GITHUB_TOKEN would trigger no workflow, so the fix would never be
#               checked.
#   job finish  labels needs-owner when the fixer or the guard says the owner must decide.
# The prompt carries the repository, the pull request number and finding ids only, never pull request text.
#
# Switch: repository variable AUTO_FIX = off | report (default: the decision goes to the job summary, nothing is
# written) | on. Without the secret REVIEW_BOT_TOKEN the run prints "autofix: NOT RUN (REVIEW_BOT_TOKEN missing)".
# Owner setup: the secret REVIEW_BOT_TOKEN (fine-grained token on this repository: contents and pull requests read and
# write), CLAUDE_CODE_OAUTH_TOKEN (already used by code-review.yml), then AUTO_FIX=on.
# workflow_run runs the copy of this file on the DEFAULT branch: nothing happens until it is on main.
name: Review auto-fix

on:
  workflow_run:
    workflows: ["Code review"]
    types: [completed]

permissions:
  contents: read

defaults:
  run:
    shell: bash

# One fixer per pull request branch at a time; a running fix is never cancelled in the middle of a push.
concurrency:
  group: review-autofix-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  decide:
    name: Decide
    if: >-
      github.event.workflow_run.event == 'pull_request'
      && github.event.workflow_run.head_repository.full_name == github.repository
      && vars.AUTO_FIX != 'off'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
      issues: write
    outputs:
      run: ${{ steps.decide.outputs.run }}
      attempt: ${{ steps.decide.outputs.attempt }}
      findings: ${{ steps.decide.outputs.findings }}
      branch: ${{ steps.decide.outputs.branch }}
      head_sha: ${{ steps.decide.outputs.head_sha }}
      pr: ${{ github.event.workflow_run.pull_requests[0].number }}
    steps:
      - name: Checkout the default branch (trusted scripts)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Decide whether to fix
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          AUTO_FIX: ${{ vars.AUTO_FIX || 'report' }}
          HAS_TOKEN: ${{ secrets.REVIEW_BOT_TOKEN != '' }}
        run: |
          if [ ! -f scripts/review-autofix.py ]; then
            echo "autofix: NOT RUN (scripts/review-autofix.py is not on the default branch)" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "run=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          python3 -I scripts/review-autofix.py pr | tee -a "$GITHUB_STEP_SUMMARY"

  fix:
    name: Fix the findings
    needs: decide
    if: needs.decide.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
      pull-requests: read
      issues: read
    outputs:
      outcome: ${{ steps.push.outputs.outcome }}
    steps:
      - name: Checkout the default branch (trusted guard)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .trusted
          fetch-depth: 1
          persist-credentials: false

      # The guard must be out of the fixer's reach: copied outside the workspace, then removed from it.
      - name: Move the guard out of the workspace
        run: |
          mkdir -p "$RUNNER_TEMP/trusted"
          cp .trusted/scripts/review-autofix.py .trusted/scripts/review-context.py .trusted/scripts/findings.py "$RUNNER_TEMP/trusted/"
          rm -rf .trusted

      - name: Checkout the pull request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.decide.outputs.branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Stop if the branch moved since the review
        env:
          HEAD_SHA: ${{ needs.decide.outputs.head_sha }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$HEAD_SHA" ]; then
            echo "autofix: skip (the branch moved after the review; the next review decides again)" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Set up Go (version from go.mod)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up pnpm (version from the packageManager field)
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false

      - name: Set up Node (version from .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install from lockfiles
        run: make setup

      # The commit identity is the owner's (CONTRIBUTING.md: never an agent identity). The noreply address is computed
      # here from the public user id, so no e-mail address is written in the repository.
      - name: Set the human commit identity
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_LOGIN: ${{ vars.REVIEW_FIX_GIT_LOGIN || 'Y4NN777' }}
          GIT_NAME: ${{ vars.REVIEW_FIX_GIT_NAME || 'Y4NN77' }}
        run: |
          id="$(gh api "users/$GIT_LOGIN" --jq .id)"
          email="${id}+${GIT_LOGIN}@users.noreply.github.com"
          {
            echo "GIT_AUTHOR_NAME=$GIT_NAME"; echo "GIT_COMMITTER_NAME=$GIT_NAME"
            echo "GIT_AUTHOR_EMAIL=$email"; echo "GIT_COMMITTER_EMAIL=$email"
          } >>"$GITHUB_ENV"
          git config user.name "$GIT_NAME"
          git config user.email "$email"
          echo "id=$id" >>"$GITHUB_OUTPUT"

      - name: Fix (Claude Code, review-fix command)
        id: claude
        uses: anthropics/claude-code-action@4d75e5f390ee76b2e09c1980ecc99ff3a2e088c8 # v1.0.275
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          bot_name: ${{ vars.REVIEW_FIX_GIT_NAME || 'Y4NN77' }}
          bot_id: ${{ steps.identity.outputs.id }}
          use_sticky_comment: 'false'
          settings: '{"includeCoAuthoredBy": false}'
          prompt: |
            REPO: ${{ github.repository }}
            MODE: pr
            PR NUMBER: ${{ needs.decide.outputs.pr }}
            FINDINGS: ${{ needs.decide.outputs.findings }}

            Read .claude/commands/review-fix.md and follow it exactly, with these arguments: pr, the PR number and the
            finding ids above. The pull request's head branch is checked out. Commit, but do not push and do not open
            or comment on anything: the workflow checks and pushes your commits. Return the result of step 5 as your
            structured output.
          claude_args: |
            --model claude-opus-5-5
            --max-turns 120
            --setting-sources user,project,local
            --json-schema '{"type":"object","properties":{"outcome":{"type":"string","enum":["fixed","nothing","needs-owner"]},"reason":{"type":"string"},"results":{"type":"array","items":{"type":"object","properties":{"item":{"type":"string"},"verdict":{"type":"string"},"reason":{"type":"string"}},"required":["item","verdict","reason"]}}},"required":["outcome","reason","results"],"additionalProperties":false}'
            --allowedTools "Read,Grep,Glob,Edit,Write,Skill,Agent,Bash(make lint),Bash(make lint-go),Bash(make lint-web),Bash(make lint-scripts),Bash(make lint-contract),Bash(make typecheck),Bash(make generate),Bash(make test-unit),Bash(make coverage),Bash(make test-integration-go),Bash(make security),Bash(go test:*),Bash(pnpm --filter web:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git add:*),Bash(git commit:*),Bash(git restore:*),Bash(gh pr view:*),Bash(gh issue view:*)"

      - name: Check the commits and push them
        id: push
        if: always() && steps.claude.outcome != 'skipped'
        env:
          RESULT_JSON: ${{ steps.claude.outputs.structured_output }}
          BASE_SHA: ${{ needs.decide.outputs.head_sha }}
          BRANCH: ${{ needs.decide.outputs.branch }}
          REPO: ${{ github.repository }}
          BOT_TOKEN: ${{ secrets.REVIEW_BOT_TOKEN }}
        run: |
          outcome="$(python3 -I -c 'import json,os,sys
          try: print(json.loads(os.environ.get("RESULT_JSON") or "{}").get("outcome","nothing"))
          except ValueError: print("nothing")')"
          echo "fixer outcome: $outcome" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$outcome" != "fixed" ]; then
            echo "outcome=$([ "$outcome" = needs-owner ] && echo owner || echo nothing)" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          if ! WORKTREE="$GITHUB_WORKSPACE" EXPECT_NAME="$GIT_AUTHOR_NAME" EXPECT_EMAIL="$GIT_AUTHOR_EMAIL" \
               python3 -I "$RUNNER_TEMP/trusted/review-autofix.py" check | tee -a "$GITHUB_STEP_SUMMARY"; then
            echo "outcome=owner" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          # A fresh repository pushes: nothing the fixer could write in the workspace's .git (hooks, config) runs here.
          push="$RUNNER_TEMP/push"
          git init -q "$push"
          git -C "$push" fetch -q --no-tags "$GITHUB_WORKSPACE" "HEAD:refs/heads/autofix"
          auth="$(printf 'x-access-token:%s' "$BOT_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git -C "$push" -c core.hooksPath=/dev/null -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            push -q "https://github.com/$REPO.git" "refs/heads/autofix:refs/heads/$BRANCH"
          echo "autofix: pushed to $BRANCH (the review and CI run again)" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "outcome=pushed" >>"$GITHUB_OUTPUT"

  finish:
    name: Hand over to the owner
    needs: [decide, fix]
    if: always() && needs.decide.outputs.run == 'true' && needs.fix.outputs.outcome == 'owner'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Label needs-owner
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.decide.outputs.pr }}
        run: |
          gh api -X POST "repos/$REPO/issues/$PR_NUMBER/labels" -f "labels[]=needs-owner" >/dev/null
          echo "autofix: needs-owner (the fixer or the guard left a decision to the owner)" | tee -a "$GITHUB_STEP_SUMMARY"
