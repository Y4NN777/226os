<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="discover.title">Discover : API et outils — 226os</title>
  <meta name="color-scheme" content="light dark">
  <script src="../assets/js/theme-init.js"></script>
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
  <link rel="stylesheet" href="../assets/css/icons.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/pages/discover.css">
</head>
<body class="app" data-active="discover" data-root="../">
  <a class="skip-link" href="#main" data-i18n="skip" data-testid="skip-link">Aller au contenu principal</a>

  <main id="main" tabindex="-1">
    <nav class="breadcrumbs" data-i18n-attr="aria-label:common.breadcrumb" data-testid="breadcrumbs">
      <ol>
        <li><a href="../index.html" data-i18n="nav.explore" data-testid="breadcrumb-home"></a></li>
        <li><span aria-current="page" data-i18n="nav.discover" data-testid="breadcrumb-current"></span></li>
      </ol>
    </nav>

    <header class="page-header">
      <h1 data-i18n="discover.h1" data-testid="page-h1"></h1>
      <p class="lede" data-i18n="discover.lede" data-testid="page-lede"></p>
    </header>

    <div class="callout" data-proto data-testid="discover-fictional-callout">
      <span class="icon icon-lead i-info" aria-hidden="true" data-testid="discover-fictional-icon"></span>
      <div><strong data-i18n="discover.fictional.title" data-testid="discover-fictional-title"></strong><span data-i18n="discover.fictional.body" data-testid="discover-fictional-body"></span></div>
    </div>

    <section class="section" aria-labelledby="discover-filters-h" data-testid="discover-filters-section">
      <h2 id="discover-filters-h" class="visually-hidden" data-i18n="discover.filters.h" data-testid="discover-filters-h"></h2>
      <form role="search" id="discover-form" class="stack-sm" novalidate data-testid="discover-form">
        <div class="discover-searchrow">
          <div class="field discover-q">
            <label class="visually-hidden" for="discover-q" data-i18n="discover.search.label" data-testid="discover-q-label"></label>
            <div class="search-field search-field-lg"><span class="icon i-search" aria-hidden="true" data-testid="discover-q-icon"></span>
              <input id="discover-q" name="q" class="input" type="search" autocomplete="off" data-i18n-attr="placeholder:discover.search.placeholder" data-testid="discover-q-input"></div>
          </div>
          <button type="button" class="btn btn-icon tip-end" id="discover-more-toggle" aria-expanded="false" aria-controls="discover-more" data-i18n-attr="aria-label:discover.filters.more" data-testid="discover-more-toggle"><span class="icon i-sliders" aria-hidden="true" data-testid="discover-more-toggle-icon"></span><span class="discover-dot" id="discover-more-dot" hidden aria-hidden="true" data-testid="discover-more-dot"></span></button>
        </div>
        <div class="discover-filters" data-testid="discover-filter-bar">
          <div class="filter-group"><label class="label" for="discover-country" data-i18n="discover.f.country" data-testid="discover-country-label"></label>
            <select id="discover-country" name="country" class="select" data-testid="discover-country-filter"></select></div>
          <div class="filter-group"><label class="label" for="discover-category" data-i18n="discover.f.category" data-testid="discover-category-label"></label>
            <select id="discover-category" name="category" class="select" data-testid="discover-category-filter"></select></div>
          <div class="filter-group"><label class="label" for="discover-sdk" data-i18n="discover.f.sdk" data-testid="discover-sdk-label"></label>
            <select id="discover-sdk" name="sdk" class="select" data-testid="discover-sdk-filter"></select></div>
        </div>
        <div class="discover-filters" id="discover-more" hidden data-testid="discover-more-filters">
          <div class="filter-group"><label class="label" for="discover-type" data-i18n="discover.f.type" data-testid="discover-type-label"></label>
            <select id="discover-type" name="type" class="select" data-testid="discover-type-filter"></select></div>
          <div class="filter-group"><label class="label" for="discover-provider" data-i18n="discover.f.provider" data-testid="discover-provider-label"></label>
            <select id="discover-provider" name="provider" class="select" data-testid="discover-provider-filter"></select></div>
          <div class="filter-group"><label class="label" for="discover-doclang" data-i18n="discover.f.doclang" data-testid="discover-doclang-label"></label>
            <select id="discover-doclang" name="doclang" class="select" data-testid="discover-doclang-filter"></select></div>
        </div>
        <div class="discover-chips" id="discover-chips" hidden data-testid="discover-chips"></div>
      </form>
    </section>

    <section class="section" id="discover-oss" aria-labelledby="discover-oss-h" data-testid="discover-oss-section">
      <div class="section-head"><h2 id="discover-oss-h" class="h3" data-i18n="discover.oss.h" data-testid="discover-oss-h"></h2>
        <a class="btn btn-ghost btn-sm" href="discover.html?type=project" data-testid="discover-oss-all"><span data-i18n="discover.oss.all" data-testid="discover-oss-all-label"></span><span class="icon i-chevron-right" aria-hidden="true" data-testid="discover-oss-all-icon"></span></a></div>
      <ul class="list-reset discover-oss" id="discover-oss-list" data-testid="discover-oss-list"></ul>
    </section>

    <section class="section" aria-labelledby="discover-results-h" data-testid="discover-results-section">
      <h2 id="discover-results-h" class="visually-hidden" data-i18n="discover.results.h" data-testid="discover-results-h"></h2>
      <div class="results-meta discover-resultsbar">
        <span role="status" id="discover-count" data-testid="discover-count"></span>
        <span class="discover-sort"><span class="icon i-sort" aria-hidden="true" data-testid="discover-sort-icon"></span>
          <label class="visually-hidden" for="discover-sort" data-i18n="common.sort" data-testid="discover-sort-label"></label>
          <select id="discover-sort" name="sort" form="discover-form" class="select select-quiet" data-testid="discover-sort-select"></select></span>
      </div>
      <div id="discover-list" data-testid="discover-list" data-state-id="discover-state"></div>
    </section>
  </main>

  <script src="../assets/js/shell.js"></script>
  <script defer src="../assets/js/app.js"></script>
  <script defer src="../assets/js/i18n-common.js"></script>
  <script defer src="../assets/data/people.js"></script>
  <script defer src="../assets/data/common.js"></script>
  <script defer src="../assets/data/build.js"></script>
  <script defer src="../assets/data/discover.js"></script>
  <script defer src="../assets/js/pages/discover.js"></script>
</body>
</html>
