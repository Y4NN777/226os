<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="project.title">Projet — 226os</title>
  <meta name="color-scheme" content="light dark">
  <script src="../assets/js/theme-init.js"></script>
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
  <link rel="stylesheet" href="../assets/css/icons.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/pages/build.css">
</head>
<body class="app" data-active="build" data-root="../">
  <a class="skip-link" href="#main" data-i18n="skip" data-testid="skip-link">Aller au contenu principal</a>

  <main id="main" tabindex="-1">
    <nav class="breadcrumbs" data-i18n-attr="aria-label:common.breadcrumb" data-testid="breadcrumbs">
      <ol>
        <li><a href="../index.html" data-i18n="nav.explore" data-testid="breadcrumb-home"></a></li>
        <li><a href="build.html" data-i18n="nav.build" data-testid="breadcrumb-build"></a></li>
        <li><span aria-current="page" id="project-crumb" data-testid="breadcrumb-current"></span></li>
      </ol>
    </nav>

    <header class="page-header" id="project-header">
      <div class="page-header-row">
        <h1 id="project-h1" class="mono" data-testid="project-h1"></h1>
        <a class="btn btn-primary" id="project-jump" href="#needs" data-testid="project-needs-link"><span class="icon i-users" aria-hidden="true" data-testid="project-needs-link-icon"></span><span data-i18n="project.jump" data-testid="project-needs-link-label"></span></a>
      </div>
      <div class="cluster" id="project-badges" data-testid="project-badges"></div>
      <p class="lede" id="project-summary" data-testid="project-summary"></p>
    </header>

    <section class="card project-demo" aria-labelledby="project-demo-h" data-testid="project-demo">
      <div class="cluster cluster-between">
        <h2 id="project-demo-h" data-i18n="project.demo.title" data-testid="project-demo-title"></h2>
        <span class="badge badge-sim" data-i18n="sim.badge" data-testid="project-demo-badge"></span>
      </div>
      <p class="hint" data-i18n="project.demo.note" data-testid="project-demo-note"></p>
      <fieldset class="project-roles" data-testid="project-role-fieldset">
        <legend class="label" data-i18n="project.demo.viewas" data-testid="project-role-legend"></legend>
        <div class="cluster" id="project-roles"></div>
      </fieldset>
      <p class="text-sm" id="project-role-desc" aria-live="polite" data-testid="project-role-desc"></p>
      <div class="cluster">
        <button type="button" class="btn btn-sm" id="project-dup-btn" data-testid="project-dup-button"><span class="icon i-refresh" aria-hidden="true" data-testid="project-dup-button-icon"></span><span data-i18n="project.demo.dup" data-testid="project-dup-button-label"></span></button>
        <span class="hint" id="project-dup-hint" data-testid="project-dup-hint"></span>
      </div>
    </section>

    <div class="section" id="project-view-wrap"><div id="project-view"></div></div>

    <dialog class="dialog" id="apply-dialog" aria-labelledby="apply-title" data-testid="apply-dialog">
      <form id="apply-form" novalidate data-testid="apply-form">
        <div class="dialog-head">
          <div><h2 id="apply-title" data-i18n="project.apply.title" data-testid="apply-title"></h2>
            <p class="text-sm"><span class="text-muted" data-i18n="project.apply.need" data-testid="apply-need-label"></span> <strong id="apply-need" data-user-content data-testid="apply-need-title"></strong></p>
            <p class="hint"><span class="badge badge-sim" data-i18n="sim.badge" data-testid="apply-sim-badge"></span> <span data-i18n="project.apply.sim" data-testid="apply-sim-note"></span></p></div>
          <button type="button" class="btn btn-ghost btn-icon" data-dialog-close data-i18n-attr="aria-label:common.close" data-testid="apply-close"><span class="icon i-x" aria-hidden="true" data-testid="apply-close-icon"></span></button>
        </div>
        <div class="dialog-body" id="apply-body">
          <div class="callout callout-danger" id="apply-dup" role="alert" tabindex="-1" hidden data-testid="apply-duplicate-error"><span class="icon icon-lead i-alert-circle" aria-hidden="true" data-testid="apply-duplicate-error-icon"></span><div><strong data-i18n="project.apply.dup.title" data-testid="apply-duplicate-title"></strong><span data-i18n="project.apply.dup.body" data-testid="apply-duplicate-body"></span></div></div>
          <div id="apply-summary" class="form-summary" role="alert" tabindex="-1" hidden data-testid="apply-error-summary"><h2 data-i18n="project.form.summary" data-testid="apply-summary-title"></h2><ul class="list-reset" id="apply-summary-list" data-testid="apply-summary-list"></ul></div>
          <div class="field" data-field="motivation">
            <label class="label" for="apply-motivation" data-testid="apply-motivation-field-label"><span data-i18n="project.apply.motivation" data-testid="apply-motivation-label"></span><span class="req" aria-hidden="true" data-testid="apply-motivation-required">*</span></label>
            <p class="hint" id="apply-motivation-hint" data-i18n="project.apply.motivation.hint" data-testid="apply-motivation-hint"></p>
            <textarea id="apply-motivation" class="textarea" maxlength="600" required aria-describedby="apply-motivation-hint apply-motivation-error" data-testid="apply-motivation-input"></textarea>
            <p class="error-msg" id="apply-motivation-error" hidden data-testid="apply-motivation-error"></p>
          </div>
          <div class="field" data-field="skills">
            <label class="label" for="apply-skills" data-testid="apply-skills-field-label"><span data-i18n="project.apply.skills" data-testid="apply-skills-label"></span><span class="req" aria-hidden="true" data-testid="apply-skills-required">*</span></label>
            <p class="hint" id="apply-skills-hint" data-i18n="project.apply.skills.hint" data-testid="apply-skills-hint"></p>
            <input id="apply-skills" class="input" type="text" maxlength="120" required aria-describedby="apply-skills-hint apply-skills-error" data-testid="apply-skills-input">
            <p class="error-msg" id="apply-skills-error" hidden data-testid="apply-skills-error"></p>
          </div>
          <div class="field" data-field="avail">
            <label class="label" for="apply-avail" data-testid="apply-avail-field-label"><span data-i18n="project.apply.avail" data-testid="apply-avail-label"></span><span class="req" aria-hidden="true" data-testid="apply-avail-required">*</span></label>
            <select id="apply-avail" class="select" required aria-describedby="apply-avail-error" data-testid="apply-avail-input"></select>
            <p class="error-msg" id="apply-avail-error" hidden data-testid="apply-avail-error"></p>
          </div>
        </div>
        <div class="dialog-body" id="apply-success" hidden>
          <div class="state state-success" role="status" data-testid="apply-success"><span class="icon i-check-circle" aria-hidden="true" data-testid="apply-success-icon"></span><h3 data-i18n="project.apply.ok.title" data-testid="apply-success-title"></h3><p data-i18n="project.apply.ok.body" data-testid="apply-success-body"></p></div>
        </div>
        <div class="dialog-foot">
          <button type="button" class="btn" id="apply-cancel" data-dialog-close data-i18n="common.cancel" data-testid="apply-cancel"></button>
          <button type="submit" class="btn btn-primary" id="apply-submit" data-testid="apply-submit"><span data-i18n="project.apply.submit" data-testid="apply-submit-label"></span></button>
        </div>
      </form>
    </dialog>

    <dialog class="dialog" id="need-dialog" aria-labelledby="need-dlg-title" data-testid="need-dialog">
      <form id="need-form" novalidate data-testid="need-form">
        <div class="dialog-head">
          <div><h2 id="need-dlg-title" data-i18n="project.pub.title" data-testid="need-title-heading"></h2>
            <p class="hint"><span class="badge badge-sim" data-i18n="sim.badge" data-testid="need-sim-badge"></span> <span data-i18n="project.pub.sim" data-testid="need-sim-note"></span></p></div>
          <button type="button" class="btn btn-ghost btn-icon" data-dialog-close data-i18n-attr="aria-label:common.close" data-testid="need-close"><span class="icon i-x" aria-hidden="true" data-testid="need-close-icon"></span></button>
        </div>
        <div class="dialog-body">
          <div id="need-summary" class="form-summary" role="alert" tabindex="-1" hidden data-testid="need-error-summary"><h2 data-i18n="project.pub.summary" data-testid="need-summary-title"></h2><ul class="list-reset" id="need-summary-list" data-testid="need-summary-list"></ul></div>
          <div class="field">
            <label class="label" for="need-title" data-testid="need-title-label"><span data-i18n="project.pub.t" data-testid="need-title-text"></span><span class="req" aria-hidden="true" data-testid="need-title-required">*</span></label>
            <p class="hint" id="need-t-hint" data-i18n="project.pub.t.hint" data-testid="need-t-hint"></p>
            <input id="need-title" class="input" type="text" maxlength="100" required aria-describedby="need-t-hint need-t-error" data-testid="need-title-input">
            <p class="error-msg" id="need-t-error" hidden data-testid="need-t-error"></p>
          </div>
          <div class="field">
            <fieldset class="fieldset-plain" id="need-skills-group" aria-describedby="need-skills-hint need-skills-error">
              <legend class="label"><span data-i18n="project.pub.skills" data-testid="need-skills-label"></span><span class="req" aria-hidden="true" data-testid="need-skills-required">*</span></legend>
              <p class="hint" id="need-skills-hint" data-i18n="project.pub.skills.hint" data-testid="need-skills-hint"></p>
              <div class="build-need-skills" id="need-skills-list" data-testid="need-skills-list"></div>
            </fieldset>
            <p class="error-msg" id="need-skills-error" hidden data-testid="need-skills-error"></p>
          </div>
          <div class="field">
            <label class="label" for="need-level" data-testid="need-level-field-label"><span data-i18n="project.pub.level" data-testid="need-level-label"></span><span class="req" aria-hidden="true" data-testid="need-level-required">*</span></label>
            <select id="need-level" class="select" required aria-describedby="need-level-error" data-testid="need-level-input"></select>
            <p class="error-msg" id="need-level-error" hidden data-testid="need-level-error"></p>
          </div>
          <div class="field">
            <label class="label" for="need-desc" data-testid="need-desc-label"><span data-i18n="project.pub.d" data-testid="need-desc-text"></span><span class="req" aria-hidden="true" data-testid="need-desc-required">*</span></label>
            <p class="hint" id="need-d-hint" data-i18n="project.pub.d.hint" data-testid="need-d-hint"></p>
            <textarea id="need-desc" class="textarea" maxlength="600" required aria-describedby="need-d-hint need-d-error" data-testid="need-desc-input"></textarea>
            <p class="error-msg" id="need-d-error" hidden data-testid="need-d-error"></p>
          </div>
        </div>
        <div class="dialog-foot">
          <button type="button" class="btn" data-dialog-close data-i18n="common.cancel" data-testid="need-cancel"></button>
          <button type="submit" class="btn btn-primary" id="need-submit" data-testid="need-submit"><span data-i18n="project.pub.submit" data-testid="need-submit-label"></span></button>
        </div>
      </form>
    </dialog>
  </main>

  <script src="../assets/js/shell.js"></script>
  <script defer src="../assets/js/app.js"></script>
  <script defer src="../assets/js/i18n-common.js"></script>
  <script defer src="../assets/js/markdown.js"></script>
  <script defer src="../assets/data/people.js"></script>
  <script defer src="../assets/data/common.js"></script>
  <script defer src="../assets/data/build.js"></script>
  <script defer src="../assets/js/pages/project.js"></script>
</body>
</html>
