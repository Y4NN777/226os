<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="auth.title">Connexion — 226os</title>
  <meta name="color-scheme" content="light dark">
  <script src="../assets/js/theme-init.js"></script>
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
  <link rel="stylesheet" href="../assets/css/icons.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/pages/auth.css">
</head>
<body class="app" data-active="identity" data-root="../">
  <a class="skip-link" href="#main" data-i18n="skip" data-testid="skip-link">Aller au contenu principal</a>

  <main id="main" tabindex="-1" class="auth-main">
    <nav class="breadcrumbs" data-i18n-attr="aria-label:common.breadcrumb" data-testid="auth-breadcrumbs">
      <ol>
        <li><a href="../index.html" data-i18n="nav.explore" data-testid="auth-breadcrumb-home"></a></li>
        <li><span aria-current="page" data-i18n="auth.h1" data-testid="auth-breadcrumb-current"></span></li>
      </ol>
    </nav>

    <header class="page-header">
      <h1 data-i18n="auth.h1" data-testid="auth-h1"></h1>
      <p class="lede" data-i18n="auth.lede" data-testid="auth-lede"></p>
    </header>

    <div class="callout auth-sim" data-testid="auth-sim-callout">
      <span class="icon i-info" aria-hidden="true" data-testid="auth-sim-icon"></span>
      <div>
        <span class="badge badge-sim" data-i18n="sim.badge" data-testid="auth-sim-badge"></span>
        <span data-i18n="auth.sim.text" data-testid="auth-sim-text"></span>
        <details class="auth-demo" data-testid="auth-demo-details">
          <summary data-i18n="auth.demo.summary" data-testid="auth-demo-summary"></summary>
          <ul data-testid="auth-demo-list">
            <li data-i18n="auth.demo.ok" data-testid="auth-demo-ok"></li>
            <li data-i18n="auth.demo.bad" data-testid="auth-demo-bad"></li>
            <li data-i18n="auth.demo.limit" data-testid="auth-demo-limit"></li>
            <li data-i18n="auth.demo.exists" data-testid="auth-demo-exists"></li>
            <li data-i18n="auth.demo.states" data-testid="auth-demo-states"></li>
          </ul>
        </details>
      </div>
    </div>

    <section class="card auth-card" aria-labelledby="auth-h1-card" data-testid="auth-card">
      <h2 id="auth-h1-card" class="visually-hidden" data-i18n="auth.card.label" data-testid="auth-card-label"></h2>
      <div data-tabs data-testid="auth-tabs">
        <div class="tablist" role="tablist" data-i18n-attr="aria-label:auth.card.label" data-testid="auth-tablist">
          <button class="tab" role="tab" id="auth-tab-signin" aria-controls="auth-panel-signin" aria-selected="true" data-testid="auth-tab-signin"><span class="icon i-user" aria-hidden="true" data-testid="auth-tab-signin-icon"></span><span data-i18n="auth.tab.signin" data-testid="auth-tab-signin-label"></span></button>
          <button class="tab" role="tab" id="auth-tab-signup" aria-controls="auth-panel-signup" aria-selected="false" tabindex="-1" data-testid="auth-tab-signup"><span class="icon i-plus" aria-hidden="true" data-testid="auth-tab-signup-icon"></span><span data-i18n="auth.tab.signup" data-testid="auth-tab-signup-label"></span></button>
        </div>

        <div class="tabpanel" role="tabpanel" id="auth-panel-signin" aria-labelledby="auth-tab-signin" tabindex="-1" data-testid="auth-panel-signin">
          <div id="auth-signin-banner" class="auth-banner" data-testid="auth-signin-banner"></div>
          <div class="form-summary" id="auth-in-summary" role="alert" tabindex="-1" hidden data-testid="auth-signin-summary">
            <h2 data-i18n="auth.summary.title" data-testid="auth-signin-summary-title"></h2>
            <ul id="auth-in-summary-list" data-testid="auth-signin-summary-list"></ul>
          </div>
          <form id="auth-signin-form" novalidate data-testid="auth-signin-form">
            
          <div class="field" id="auth-in-f-email">
            <label class="label" for="auth-in-email" data-testid="auth-signin-email-field-label"><span data-i18n="auth.email" data-testid="auth-signin-email-label"></span><span class="req" aria-hidden="true" data-testid="auth-signin-email-req">*</span></label>
            <input class="input" id="auth-in-email" name="email" type="email" required autocomplete="username" inputmode="email" autocapitalize="none" spellcheck="false" maxlength="254" aria-describedby="auth-in-email-error" data-testid="auth-signin-email-input">
            <p class="error-msg" id="auth-in-email-error" hidden data-testid="auth-signin-email-error"><span class="icon i-alert-circle" aria-hidden="true" data-testid="auth-signin-email-error-icon"></span><span data-testid="auth-signin-email-error-text"></span></p>
          </div>
            
          <div class="field" id="auth-in-f-password">
            <label class="label" for="auth-in-password" data-testid="auth-signin-password-field-label"><span data-i18n="auth.password" data-testid="auth-signin-password-label"></span><span class="req" aria-hidden="true" data-testid="auth-signin-password-req">*</span></label>
            <div class="auth-pw">
              <input class="input" id="auth-in-password" name="password" type="password" required autocomplete="current-password" maxlength="128" autocapitalize="none" spellcheck="false" aria-describedby="auth-in-password-error" data-testid="auth-signin-password-input">
              <button type="button" class="btn auth-pw-toggle" data-pw-toggle="auth-in-password" aria-pressed="false" aria-controls="auth-in-password" data-testid="auth-signin-password-toggle"><span data-pw-label data-i18n="auth.pw.show" data-testid="auth-signin-password-toggle-label"></span></button>
            </div>
            <p class="error-msg" id="auth-in-password-error" hidden data-testid="auth-signin-password-error"><span class="icon i-alert-circle" aria-hidden="true" data-testid="auth-signin-password-error-icon"></span><span data-testid="auth-signin-password-error-text"></span></p>
          </div>
            <div class="auth-actions">
              <button type="submit" class="btn btn-primary" id="auth-signin-submit" data-testid="auth-signin-submit"><span class="spinner" aria-hidden="true" hidden data-testid="auth-signin-spinner"></span><span id="auth-signin-submit-label" data-i18n="auth.signin.submit" data-testid="auth-signin-submit-label"></span></button>
              <button type="button" class="btn btn-ghost" data-dialog-open="auth-forgot-dialog" data-testid="auth-forgot-open"><span data-i18n="auth.forgot.open" data-testid="auth-forgot-open-label"></span></button>
            </div>
          </form>
          <p class="text-sm text-muted auth-switch" data-testid="auth-signin-switch"><span data-i18n="auth.signin.noaccount" data-testid="auth-signin-switch-text"></span> <button type="button" class="btn btn-ghost btn-sm" data-auth-tab="1" data-testid="auth-signin-switch-button"><span data-i18n="auth.tab.signup" data-testid="auth-signin-switch-label"></span></button></p>
        </div>

        <div class="tabpanel" role="tabpanel" id="auth-panel-signup" aria-labelledby="auth-tab-signup" tabindex="-1" hidden data-testid="auth-panel-signup">
          <div id="auth-signup-form-box" data-testid="auth-signup-form-box">
          <div class="form-summary" id="auth-up-summary" role="alert" tabindex="-1" hidden data-testid="auth-signup-summary">
            <h2 data-i18n="auth.summary.title" data-testid="auth-signup-summary-title"></h2>
            <ul id="auth-up-summary-list" data-testid="auth-signup-summary-list"></ul>
          </div>
          <form id="auth-signup-form" novalidate data-testid="auth-signup-form">
            <div class="field" id="auth-up-f-name">
              <label class="label" for="auth-up-name" data-testid="auth-signup-name-field-label"><span data-i18n="auth.name" data-testid="auth-signup-name-label"></span><span class="req" aria-hidden="true" data-testid="auth-signup-name-req">*</span></label>
              <p class="hint" id="auth-up-name-hint" data-i18n="auth.name.hint" data-testid="auth-signup-name-hint"></p>
              <input class="input" id="auth-up-name" name="name" type="text" required autocomplete="nickname" maxlength="80" aria-describedby="auth-up-name-hint auth-up-name-error" data-testid="auth-signup-name-input">
              <p class="error-msg" id="auth-up-name-error" hidden data-testid="auth-signup-name-error"><span class="icon i-alert-circle" aria-hidden="true" data-testid="auth-signup-name-error-icon"></span><span data-testid="auth-signup-name-error-text"></span></p>
            </div>
            
          <div class="field" id="auth-up-f-email">
            <label class="label" for="auth-up-email" data-testid="auth-signup-email-field-label"><span data-i18n="auth.email" data-testid="auth-signup-email-label"></span><span class="req" aria-hidden="true" data-testid="auth-signup-email-req">*</span></label>
            <input class="input" id="auth-up-email" name="email" type="email" required autocomplete="email" inputmode="email" autocapitalize="none" spellcheck="false" maxlength="254" aria-describedby="auth-up-email-error" data-testid="auth-signup-email-input">
            <p class="error-msg" id="auth-up-email-error" hidden data-testid="auth-signup-email-error"><span class="icon i-alert-circle" aria-hidden="true" data-testid="auth-signup-email-error-icon"></span><span data-testid="auth-signup-email-error-text"></span></p>
          </div>
            
          <div class="field" id="auth-up-f-password">
            <label class="label" for="auth-up-password" data-testid="auth-signup-password-field-label"><span data-i18n="auth.password" data-testid="auth-signup-password-label"></span><span class="req" aria-hidden="true" data-testid="auth-signup-password-req">*</span></label>
            <p class="hint" id="auth-up-password-hint" data-i18n="auth.pw.hint" data-testid="auth-signup-password-hint"></p>
            <div class="auth-pw">
              <input class="input" id="auth-up-password" name="password" type="password" required autocomplete="new-password" maxlength="128" autocapitalize="none" spellcheck="false" aria-describedby="auth-up-password-hint auth-up-password-error" data-testid="auth-signup-password-input">
              <button type="button" class="btn auth-pw-toggle" data-pw-toggle="auth-up-password" aria-pressed="false" aria-controls="auth-up-password" data-testid="auth-signup-password-toggle"><span data-pw-label data-i18n="auth.pw.show" data-testid="auth-signup-password-toggle-label"></span></button>
            </div>
            <p class="error-msg" id="auth-up-password-error" hidden data-testid="auth-signup-password-error"><span class="icon i-alert-circle" aria-hidden="true" data-testid="auth-signup-password-error-icon"></span><span data-testid="auth-signup-password-error-text"></span></p>
          </div>
            <div class="field" id="auth-up-f-country">
              <label class="label" for="auth-up-country" data-testid="auth-signup-country-field-label"><span data-i18n="auth.country" data-testid="auth-signup-country-label"></span><span class="req" aria-hidden="true" data-testid="auth-signup-country-req">*</span></label>
              <select class="select" id="auth-up-country" name="country" required autocomplete="country" aria-describedby="auth-up-country-error" data-testid="auth-signup-country-input"></select>
              <p class="error-msg" id="auth-up-country-error" hidden data-testid="auth-signup-country-error"><span class="icon i-alert-circle" aria-hidden="true" data-testid="auth-signup-country-error-icon"></span><span data-testid="auth-signup-country-error-text"></span></p>
            </div>
            <div class="field" id="auth-up-f-langs">
              <fieldset class="auth-fieldset" aria-describedby="auth-up-langs-hint auth-up-langs-error" data-testid="auth-signup-langs-fieldset">
                <legend class="label"><span data-i18n="auth.langs" data-testid="auth-signup-langs-label"></span><span class="req" aria-hidden="true" data-testid="auth-signup-langs-req">*</span></legend>
                <p class="hint" id="auth-up-langs-hint" data-i18n="auth.langs.hint" data-testid="auth-signup-langs-hint"></p>
                <div class="cluster">
                  <label class="choice" data-testid="auth-signup-langs-fr-choice"><input type="checkbox" name="langs" value="fr" id="auth-up-langs" data-testid="auth-signup-langs-fr-input"><span data-i18n="auth.lang.fr" data-testid="auth-signup-langs-fr-label"></span></label>
                  <label class="choice" data-testid="auth-signup-langs-en-choice"><input type="checkbox" name="langs" value="en" data-testid="auth-signup-langs-en-input"><span data-i18n="auth.lang.en" data-testid="auth-signup-langs-en-label"></span></label>
                </div>
              </fieldset>
              <p class="error-msg" id="auth-up-langs-error" hidden data-testid="auth-signup-langs-error"><span class="icon i-alert-circle" aria-hidden="true" data-testid="auth-signup-langs-error-icon"></span><span data-testid="auth-signup-langs-error-text"></span></p>
            </div>
            <p class="hint auth-privacy" data-i18n="auth.privacy" data-testid="auth-signup-privacy"></p>
            <div class="auth-actions">
              <button type="submit" class="btn btn-primary" id="auth-signup-submit" data-testid="auth-signup-submit"><span class="spinner" aria-hidden="true" hidden data-testid="auth-signup-spinner"></span><span id="auth-signup-submit-label" data-i18n="auth.signup.submit" data-testid="auth-signup-submit-label"></span></button>
            </div>
          </form>
          <p class="text-sm text-muted auth-switch" data-testid="auth-signup-switch"><span data-i18n="auth.signup.hasaccount" data-testid="auth-signup-switch-text"></span> <button type="button" class="btn btn-ghost btn-sm" data-auth-tab="0" data-testid="auth-signup-switch-button"><span data-i18n="auth.tab.signin" data-testid="auth-signup-switch-label"></span></button></p>
          </div>

          <div class="state state-success auth-verify" id="auth-verify-panel" role="status" tabindex="-1" hidden data-testid="auth-verify-panel">
            <span class="icon i-inbox" aria-hidden="true" data-testid="auth-verify-icon"></span>
            <h3 data-i18n="auth.verify.title" data-testid="auth-verify-title"></h3>
            <p data-i18n="auth.verify.body" data-testid="auth-verify-body"></p>
            <p class="text-sm" data-i18n="auth.verify.sim" data-testid="auth-verify-sim"></p>
            <div class="state-actions">
              <button type="button" class="btn btn-primary btn-sm" id="auth-verify-confirm" data-testid="auth-verify-confirm"><span class="icon i-check" aria-hidden="true" data-testid="auth-verify-confirm-icon"></span><span data-i18n="auth.verify.confirm" data-testid="auth-verify-confirm-label"></span></button>
              <button type="button" class="btn btn-sm" id="auth-verify-resend" data-testid="auth-verify-resend"><span class="icon i-send" aria-hidden="true" data-testid="auth-verify-resend-icon"></span><span data-i18n="auth.verify.resend" data-testid="auth-verify-resend-label"></span></button>
              <button type="button" class="btn btn-ghost btn-sm" data-auth-tab="0" data-testid="auth-verify-back"><span data-i18n="auth.verify.back" data-testid="auth-verify-back-label"></span></button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section class="auth-security" aria-labelledby="auth-sec-h" data-testid="auth-security">
      <h2 id="auth-sec-h" class="h4" data-i18n="auth.sec.h" data-testid="auth-sec-h"></h2>
      <ul class="text-sm text-muted" data-testid="auth-sec-list">
        <li data-i18n="auth.sec.1" data-testid="auth-sec-1"></li>
        <li data-i18n="auth.sec.2" data-testid="auth-sec-2"></li>
        <li data-i18n="auth.sec.3" data-testid="auth-sec-3"></li>
      </ul>
    </section>
  </main>

  <dialog class="dialog" id="auth-forgot-dialog" aria-labelledby="auth-forgot-title" data-testid="auth-forgot-dialog">
    <form id="auth-forgot-form" novalidate data-testid="auth-forgot-form">
      <div class="dialog-head">
        <h2 id="auth-forgot-title" data-i18n="auth.forgot.title" data-testid="auth-forgot-title"></h2>
        <button type="button" class="btn btn-ghost btn-icon" data-dialog-close data-i18n-attr="aria-label:common.close" data-testid="auth-forgot-close"><span class="icon i-x" aria-hidden="true" data-testid="auth-forgot-close-icon"></span></button>
      </div>
      <div class="dialog-body">
        <p class="callout" data-testid="auth-forgot-sim"><span class="icon i-info" aria-hidden="true" data-testid="auth-forgot-sim-icon"></span><span><span class="badge badge-sim" data-i18n="sim.badge" data-testid="auth-forgot-sim-badge"></span> <span data-i18n="auth.forgot.sim" data-testid="auth-forgot-sim-text"></span></span></p>
        <div id="auth-forgot-fields" data-testid="auth-forgot-fields">
          <p class="hint" data-i18n="auth.forgot.body" data-testid="auth-forgot-body"></p>
          <div class="field" id="auth-fg-f-email">
            <label class="label" for="auth-fg-email" data-testid="auth-forgot-email-field-label"><span data-i18n="auth.email" data-testid="auth-forgot-email-label"></span><span class="req" aria-hidden="true" data-testid="auth-forgot-email-req">*</span></label>
            <input class="input" id="auth-fg-email" name="email" type="email" required autocomplete="email" inputmode="email" autocapitalize="none" spellcheck="false" maxlength="254" aria-describedby="auth-fg-email-error" data-testid="auth-forgot-email-input">
            <p class="error-msg" id="auth-fg-email-error" hidden data-testid="auth-forgot-email-error"><span class="icon i-alert-circle" aria-hidden="true" data-testid="auth-forgot-email-error-icon"></span><span data-testid="auth-forgot-email-error-text"></span></p>
          </div>
        </div>
        <div class="callout callout-success" id="auth-forgot-done" role="status" tabindex="-1" hidden data-testid="auth-forgot-done">
          <span class="icon i-check-circle" aria-hidden="true" data-testid="auth-forgot-done-icon"></span>
          <div><strong data-i18n="auth.forgot.done.title" data-testid="auth-forgot-done-title"></strong><span data-i18n="auth.forgot.done.body" data-testid="auth-forgot-done-body"></span></div>
        </div>
      </div>
      <div class="dialog-foot">
        <button type="button" class="btn btn-ghost" data-dialog-close data-testid="auth-forgot-cancel"><span data-i18n="common.close" data-testid="auth-forgot-cancel-label"></span></button>
        <button type="submit" class="btn btn-primary" id="auth-forgot-submit" data-testid="auth-forgot-submit"><span data-i18n="auth.forgot.submit" data-testid="auth-forgot-submit-label"></span></button>
      </div>
    </form>
  </dialog>

  <script src="../assets/js/shell.js"></script>
  <script defer src="../assets/js/app.js"></script>
  <script defer src="../assets/js/i18n-common.js"></script>
  <script defer src="../assets/data/people.js"></script>
  <script defer src="../assets/data/common.js"></script>
  <script defer src="../assets/js/pages/auth.js"></script>
</body>
</html>
