<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="build.title">Build — Projets open source — 226os</title>
  <meta name="color-scheme" content="light dark">
  <script src="../assets/js/theme-init.js"></script>
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
  <link rel="stylesheet" href="../assets/css/icons.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/pages/build.css">
</head>
<body class="app" data-active="build" data-root="../">
  <a class="skip-link" href="#main" data-i18n="skip" data-testid="skip-link">Aller au contenu principal</a>

  <main id="main" tabindex="-1">
    <nav class="breadcrumbs" data-i18n-attr="aria-label:common.breadcrumb" data-testid="breadcrumbs">
      <ol>
        <li><a href="../index.html" data-i18n="nav.explore" data-testid="breadcrumb-home"></a></li>
        <li><span aria-current="page" data-i18n="nav.build" data-testid="breadcrumb-current"></span></li>
      </ol>
    </nav>

    <header class="page-header">
      <div class="page-header-row">
        <h1 data-i18n="build.h1" data-testid="build-h1"></h1>
        <button type="button" class="btn btn-primary" data-dialog-open="propose-dialog" data-testid="build-propose-button"><span class="icon i-plus" aria-hidden="true"></span><span data-i18n="build.propose.open"></span></button>
      </div>
      <p class="lede" data-i18n="build.lede" data-testid="build-lede"></p>
    </header>

    <section aria-labelledby="build-filters-h" data-testid="build-filters-section">
      <h2 id="build-filters-h" class="visually-hidden" data-i18n="build.filters.title" data-testid="build-filters-heading"></h2>
      <form id="build-filter-form" class="build-filters" role="search" data-i18n-attr="aria-label:build.filters.title" novalidate data-testid="build-filter-form">
        <div class="field">
          <label class="label visually-hidden" for="build-q" data-i18n="build.search.label" data-testid="build-q-label"></label>
          <div class="search-field search-field-lg"><span class="icon i-search" aria-hidden="true"></span>
            <input id="build-q" class="input" type="search" name="q" autocomplete="off" data-i18n-attr="placeholder:build.search.placeholder" data-testid="build-q-input"></div>
        </div>
        <div class="filter-bar filter-bar-grid" data-testid="build-filter-bar">
          <div class="filter-group"><label class="label" for="build-country" data-i18n="build.filter.country" data-testid="build-country-label"></label><select id="build-country" class="select" data-testid="build-country-filter"></select></div>
          <div class="filter-group"><label class="label" for="build-stage" data-i18n="build.filter.stage" data-testid="build-stage-label"></label><select id="build-stage" class="select" data-testid="build-stage-filter"></select></div>
          <div class="filter-group"><label class="label" for="build-lang" data-i18n="build.filter.lang" data-testid="build-lang-label"></label><select id="build-lang" class="select" data-testid="build-lang-filter"></select></div>
          <div class="filter-group"><label class="label" for="build-license" data-i18n="build.filter.license" data-testid="build-license-label"></label><select id="build-license" class="select" data-testid="build-license-filter"></select></div>
          <div class="filter-group"><label class="label" for="build-sort" data-i18n="common.sort" data-testid="build-sort-label"></label><select id="build-sort" class="select" data-testid="build-sort-select"></select></div>
        </div>
        <div class="filter-group">
          <span class="label" id="build-skills-label" data-i18n="build.filter.skills" data-testid="build-skills-label"></span>
          <div class="filter-chips" id="build-skill-chips" role="group" aria-labelledby="build-skills-label" data-testid="build-skills-filter"></div>
        </div>
        <div class="cluster">
          <label class="choice"><input type="checkbox" id="build-open-only" data-testid="build-open-only-input"><span data-i18n="build.filter.openOnly" data-testid="build-open-only-label"></span></label>
          <button type="button" class="btn btn-ghost btn-sm" id="build-reset" data-testid="build-reset-button"><span class="icon i-refresh" aria-hidden="true"></span><span data-i18n="build.filter.reset"></span></button>
        </div>
      </form>
    </section>

    <section class="section" aria-labelledby="build-results-h" data-testid="build-results-section">
      <div class="results-meta">
        <h2 id="build-results-h" data-i18n="build.results.title" data-testid="build-results-heading"></h2>
        <p id="build-count" role="status" data-testid="build-results-count"></p>
      </div>
      <div id="build-list"></div>
    </section>

    <dialog class="dialog" id="propose-dialog" aria-labelledby="propose-title" data-testid="propose-dialog">
      <form id="propose-form" novalidate data-testid="propose-form">
        <div class="dialog-head">
          <div><h2 id="propose-title" data-i18n="build.propose.title" data-testid="propose-title"></h2>
            <p class="hint"><span class="badge badge-sim" data-i18n="sim.badge" data-testid="propose-sim-badge"></span> <span data-i18n="build.propose.sim" data-testid="propose-sim-note"></span></p></div>
          <button type="button" class="btn btn-ghost btn-icon" data-dialog-close data-i18n-attr="aria-label:common.close" data-testid="propose-close"><span class="icon i-x" aria-hidden="true"></span></button>
        </div>
        <div class="dialog-body" id="propose-body">
          <div id="propose-summary" class="form-summary" role="alert" tabindex="-1" hidden data-testid="propose-error-summary"><h2 data-i18n="build.form.summary" data-testid="propose-summary-title"></h2><ul class="list-reset" id="propose-summary-list" data-testid="propose-summary-list"></ul></div>
          <div class="field" data-field="url">
            <label class="label" for="propose-url"><span data-i18n="build.propose.url" data-testid="propose-url-label"></span><span class="req" aria-hidden="true">*</span></label>
            <p class="hint" id="propose-url-hint" data-i18n="build.propose.url.hint" data-testid="propose-url-hint"></p>
            <input id="propose-url" class="input" type="url" inputmode="url" autocomplete="off" required aria-describedby="propose-url-hint propose-url-error" placeholder="https://github.com/exemple-226/mon-projet" data-testid="propose-url-input">
            <p class="error-msg" id="propose-url-error" hidden data-testid="propose-url-error"></p>
          </div>
          <div class="field" data-field="name">
            <label class="label" for="propose-name"><span data-i18n="build.propose.name" data-testid="propose-name-label"></span><span class="req" aria-hidden="true">*</span></label>
            <input id="propose-name" class="input" type="text" maxlength="60" required aria-describedby="propose-name-error" data-testid="propose-name-input">
            <p class="error-msg" id="propose-name-error" hidden data-testid="propose-name-error"></p>
          </div>
          <div class="field" data-field="summary">
            <label class="label" for="propose-summary-input"><span data-i18n="build.propose.summary" data-testid="propose-summary-label"></span><span class="req" aria-hidden="true">*</span></label>
            <p class="hint" id="propose-summary-hint" data-i18n="build.propose.summary.hint" data-testid="propose-summary-hint"></p>
            <textarea id="propose-summary-input" class="textarea" maxlength="280" required aria-describedby="propose-summary-hint propose-summary-error" data-testid="propose-summary-input"></textarea>
            <p class="error-msg" id="propose-summary-error" hidden data-testid="propose-summary-error"></p>
          </div>
          <div class="build-two">
            <div class="field"><label class="label" for="propose-stage" data-i18n="build.filter.stage" data-testid="propose-stage-label"></label><select id="propose-stage" class="select" data-testid="propose-stage-input"></select></div>
            <div class="field"><label class="label" for="propose-license" data-i18n="build.filter.license" data-testid="propose-license-label"></label><select id="propose-license" class="select" data-testid="propose-license-input"></select></div>
          </div>
        </div>
        <div class="dialog-body" id="propose-success" hidden>
          <div class="state state-success" role="status" data-testid="propose-success"><span class="icon i-check-circle" aria-hidden="true"></span><h3 data-i18n="build.propose.ok.title" data-testid="propose-success-title"></h3><p data-i18n="build.propose.ok.body" data-testid="propose-success-body"></p></div>
        </div>
        <div class="dialog-foot">
          <button type="button" class="btn" data-dialog-close data-i18n="common.cancel" data-testid="propose-cancel"></button>
          <button type="submit" class="btn btn-primary" id="propose-submit" data-testid="propose-submit"><span data-i18n="build.propose.submit"></span></button>
        </div>
      </form>
    </dialog>
  </main>

  <script src="../assets/js/shell.js"></script>
  <script defer src="../assets/js/app.js"></script>
  <script defer src="../assets/js/i18n-common.js"></script>
  <script defer src="../assets/data/people.js"></script>
  <script defer src="../assets/data/common.js"></script>
  <script defer src="../assets/data/build.js"></script>
  <script defer src="../assets/js/pages/build.js"></script>
</body>
</html>
