<!doctype html>
<!-- 226os prototype page template. COPY to pages/<name>.html. Do not edit this file. See ../CONVENTIONS.md.
     1) set <title> + data-i18n key  2) set data-active (explore|solve|discover|build|identity|connect)  3) write content inside <main>
     4) register your dictionary in assets/js/pages/<name>.js and list lane scripts after the shared ones. -->
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="tpl.title">Modèle de page — 226os</title>
  <meta name="color-scheme" content="light dark">
  <script src="../assets/js/theme-init.js"></script>
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
  <link rel="stylesheet" href="../assets/css/icons.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <!-- Only for genuinely new patterns (reuse first): -->
  <!-- <link rel="stylesheet" href="../assets/css/pages/LANE.css"> -->
</head>
<body class="app" data-active="solve" data-root="../">
  <a class="skip-link" href="#main" data-i18n="skip" data-testid="skip-link">Aller au contenu principal</a>

  <main id="main" tabindex="-1">
    <nav class="breadcrumbs" data-i18n-attr="aria-label:common.breadcrumb" data-testid="breadcrumbs">
      <ol>
        <li><a href="../index.html" data-i18n="nav.explore" data-testid="breadcrumb-home"></a></li>
        <li><span aria-current="page" data-i18n="tpl.h1" data-testid="breadcrumb-current"></span></li>
      </ol>
    </nav>

    <header class="page-header">
      <div class="page-header-row">
        <h1 data-i18n="tpl.h1" data-testid="page-h1"></h1>
        <button type="button" class="btn btn-primary" data-sim data-testid="page-primary-action"><span class="icon i-plus" aria-hidden="true" data-testid="page-primary-action-icon"></span><span data-i18n="tpl.action" data-testid="page-primary-action-label"></span></button>
      </div>
      <p class="lede" data-i18n="tpl.lede" data-testid="page-lede"></p>
    </header>

    <!-- Simulated async list: Sim adds the visible "Simulé / Simulated" marker; try ?state=loading|empty|error -->
    <section aria-labelledby="tpl-list-h" data-testid="tpl-section">
      <h2 id="tpl-list-h" class="visually-hidden" data-i18n="tpl.h1" data-testid="tpl-section-h1"></h2>
      <div id="tpl-list"></div>
    </section>
  </main>

  <script src="../assets/js/shell.js"></script>
  <script defer src="../assets/js/app.js"></script>
  <script defer src="../assets/js/i18n-common.js"></script>
  <script defer src="../assets/data/people.js"></script>
  <script defer src="../assets/data/common.js"></script>
  <!-- lane scripts last: <script defer src="../assets/data/LANE.js"></script> <script defer src="../assets/js/pages/NAME.js"></script> -->
  <script defer src="../assets/js/pages/template-demo.js"></script>   <!-- rename + replace with assets/js/pages/<name>.js -->
</body>
</html>
