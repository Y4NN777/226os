<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="profile.title">Profil développeur — 226os</title>
  <meta name="color-scheme" content="light dark">
  <script src="../assets/js/theme-init.js"></script>
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
  <link rel="stylesheet" href="../assets/css/icons.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/pages/identity.css">
</head>
<body class="app" data-active="identity" data-root="../">
  <a class="skip-link" href="#main" data-i18n="skip" data-testid="skip-link">Aller au contenu principal</a>

  <main id="main" tabindex="-1">
    <nav class="breadcrumbs" data-i18n-attr="aria-label:common.breadcrumb" data-testid="breadcrumbs">
      <ol>
        <li><a href="../index.html" data-i18n="nav.explore" data-testid="breadcrumb-home"></a></li>
        <li><span aria-current="page" data-i18n="profile.crumb" data-testid="breadcrumb-current"></span></li>
      </ol>
    </nav>

    <header class="page-header">
      <div class="page-header-row">
        <div class="profile-id">
          <span id="profile-avatar" data-testid="profile-avatar"></span>
          <div class="profile-id-text">
            <h1 id="profile-name" lang="fr" data-user-content data-testid="profile-name"></h1>
            <p class="meta" id="profile-sub" data-testid="profile-sub"></p>
          </div>
        </div>
        <button type="button" class="btn btn-icon tip-top" id="profile-edit-open" data-dialog-open="profile-edit-dialog" hidden data-i18n-attr="aria-label:profile.edit.open" data-testid="profile-edit-open"><span class="icon i-edit" aria-hidden="true" data-testid="profile-edit-open-icon"></span></button>
      </div>
      <p class="lede" data-proto data-i18n="profile.lede" data-testid="profile-lede"></p>
    </header>

    <div class="state state-error" id="profile-notfound" hidden data-testid="profile-notfound">
      <span class="icon i-alert-circle" aria-hidden="true" data-testid="profile-notfound-icon"></span>
      <h2 data-i18n="profile.notfound.title" data-testid="profile-notfound-title"></h2>
      <p data-i18n="profile.notfound.body" data-testid="profile-notfound-body"></p>
      <a class="btn btn-sm" href="profile.html" data-i18n="profile.notfound.cta" data-testid="profile-notfound-cta"></a>
    </div>

    <div id="profile-content">
      <section class="viewas callout" data-proto aria-labelledby="viewas-h" data-testid="profile-viewas">
        <h2 id="viewas-h" class="label" data-i18n="profile.viewas.label" data-testid="profile-viewas-label"></h2>
        <p class="hint" role="status" id="profile-viewas-status" data-testid="profile-viewas-status"></p>
      </section>

      <div class="callout" id="profile-anon-note" hidden data-testid="profile-anon-note">
        <span class="icon i-lock" aria-hidden="true" data-testid="profile-anon-icon"></span>
        <div><strong data-i18n="profile.anon.title" data-testid="profile-anon-title"></strong><span data-i18n="profile.anon.body" data-testid="profile-anon-body"></span>
          <p><a class="btn btn-sm" href="auth.html" data-testid="profile-anon-signin"><span data-i18n="profile.anon.signin" data-testid="profile-anon-signin-label"></span></a></p></div>
      </div>

      <div class="with-aside profile-layout">
        <div class="stack-lg">
          <section aria-labelledby="about-h" data-testid="profile-about-section">
            <div class="section-head"><h2 id="about-h" data-i18n="profile.about.h" data-testid="profile-about-h"></h2></div>
            <div id="profile-about" class="stack" data-testid="profile-about"></div>
          </section>

          <section aria-labelledby="activity-h" data-testid="profile-activity-section">
            <div class="section-head"><h2 id="activity-h" data-i18n="profile.activity.h" data-testid="profile-activity-h"></h2></div>
            <p class="sim-marker text-sm text-muted" data-proto data-sim-marker data-testid="sim-marker"><span class="badge badge-sim" data-i18n="sim.badge" data-testid="sim-marker-badge"></span> <span data-i18n="sim.note" data-testid="sim-marker-note"></span></p>
            <div data-tabs>
              <div class="tablist" role="tablist" data-i18n-attr="aria-label:profile.activity.h" data-testid="profile-tablist">
                <button class="tab" role="tab" id="tab-q" aria-controls="panel-q" aria-selected="true" data-i18n="profile.tab.q" data-testid="profile-tab-questions"></button>
                <button class="tab" role="tab" id="tab-a" aria-controls="panel-a" aria-selected="false" data-i18n="profile.tab.a" data-testid="profile-tab-answers"></button>
                <button class="tab" role="tab" id="tab-p" aria-controls="panel-p" aria-selected="false" data-i18n="profile.tab.p" data-testid="profile-tab-projects"></button>
                <button class="tab" role="tab" id="tab-c" aria-controls="panel-c" aria-selected="false" data-i18n="profile.tab.c" data-testid="profile-tab-contributions"></button>
              </div>
              <div class="tabpanel" role="tabpanel" id="panel-q" aria-labelledby="tab-q" tabindex="0" data-testid="profile-panel-questions"><div id="act-q" data-state-id="profile-questions-state"></div></div>
              <div class="tabpanel" role="tabpanel" id="panel-a" aria-labelledby="tab-a" tabindex="0" hidden data-testid="profile-panel-answers"><div id="act-a" data-state-id="profile-answers-state"></div></div>
              <div class="tabpanel" role="tabpanel" id="panel-p" aria-labelledby="tab-p" tabindex="0" hidden data-testid="profile-panel-projects"><div id="act-p" data-state-id="profile-projects-state"></div></div>
              <div class="tabpanel" role="tabpanel" id="panel-c" aria-labelledby="tab-c" tabindex="0" hidden data-testid="profile-panel-contributions"><div id="act-c" data-state-id="profile-contributions-state"></div></div>
            </div>
          </section>

          <section data-proto aria-labelledby="privacy-h" data-testid="profile-privacy-section">
            <div class="section-head"><h2 id="privacy-h" data-i18n="profile.privacy.h" data-testid="profile-privacy-h"></h2></div>
            <p class="hint" data-i18n="profile.privacy.note" data-testid="profile-privacy-note"></p>
            <div class="table-wrap" tabindex="0" role="region" data-i18n-attr="aria-label:profile.privacy.region" data-testid="profile-privacy-region">
              <table class="table profile-privacy-table" data-testid="profile-privacy-table">
                <caption class="visually-hidden" data-i18n="profile.privacy.h" data-testid="profile-privacy-caption"></caption>
                <thead><tr>
                  <th scope="col" data-i18n="profile.privacy.col.field" data-testid="profile-privacy-th-field"></th>
                  <th scope="col" data-i18n="profile.privacy.col.who" data-testid="profile-privacy-th-who"></th>
                  <th scope="col" data-i18n="profile.privacy.col.now" data-testid="profile-privacy-th-now"></th>
                </tr></thead>
                <tbody id="profile-privacy-body"></tbody>
              </table>
            </div>
          </section>
        </div>

        <aside class="stack-lg" aria-label="" data-i18n-attr="aria-label:profile.aside.label" data-testid="profile-aside">
          <section aria-labelledby="details-h" data-testid="profile-details-section">
            <div class="section-head"><h2 id="details-h" data-i18n="profile.details.h" data-testid="profile-details-h"></h2></div>
            <dl class="dl-meta" id="profile-details" data-testid="profile-details"></dl>
          </section>
        </aside>
      </div>
    </div>
  </main>

  <dialog class="dialog" id="profile-edit-dialog" aria-labelledby="pe-title" data-testid="profile-edit-dialog">
    <form id="profile-edit-form" novalidate data-testid="profile-edit-form">
      <div class="dialog-head">
        <h2 id="pe-title" data-i18n="profile.edit.title" data-testid="profile-edit-title"></h2>
        <button type="button" class="btn btn-icon" data-dialog-close data-i18n-attr="aria-label:common.close" data-testid="profile-edit-close"><span class="icon i-x" aria-hidden="true" data-testid="profile-edit-close-icon"></span></button>
      </div>
      <div class="dialog-body">
        <p class="callout" data-proto data-testid="profile-edit-sim"><span class="icon i-info" aria-hidden="true" data-testid="profile-edit-sim-icon"></span><span><span class="badge badge-sim" data-i18n="sim.badge" data-testid="profile-edit-sim-badge"></span> <span data-i18n="profile.edit.sim" data-testid="profile-edit-sim-text"></span></span></p>
        <div class="form-summary" id="pe-summary" role="alert" tabindex="-1" hidden data-testid="profile-edit-summary">
          <h2 data-i18n="profile.edit.summary" data-testid="profile-edit-summary-title"></h2>
          <ul id="pe-summary-list" data-testid="profile-edit-summary-list"></ul>
        </div>

        <div class="field" id="pe-f-name">
          <label class="label" for="pe-name" data-testid="profile-edit-name-field-label"><span data-i18n="profile.edit.name" data-testid="profile-edit-name-label"></span><span class="req" aria-hidden="true" data-testid="profile-edit-name-required">*</span></label>
          <input class="input" id="pe-name" name="name" type="text" required autocomplete="name" maxlength="80" data-testid="profile-edit-name-input">
          <p class="error-msg" id="pe-name-error" hidden data-testid="profile-edit-name-error"></p>
        </div>

        <div class="field" id="pe-f-country">
          <label class="label" for="pe-country" data-testid="profile-edit-country-field-label"><span data-i18n="profile.edit.country" data-testid="profile-edit-country-label"></span><span class="req" aria-hidden="true" data-testid="profile-edit-country-required">*</span></label>
          <select class="select" id="pe-country" name="country" required data-testid="profile-edit-country-input"></select>
          <p class="error-msg" id="pe-country-error" hidden data-testid="profile-edit-country-error"></p>
        </div>

        <div class="field" id="pe-f-langs">
          <fieldset class="fieldset-plain" data-testid="profile-edit-langs-fieldset">
            <legend class="label"><span data-i18n="profile.edit.langs" data-testid="profile-edit-langs-label"></span><span class="req" aria-hidden="true" data-testid="profile-edit-langs-required">*</span></legend>
            <div class="cluster">
              <label class="choice" data-testid="profile-edit-langs-fr-choice"><input type="checkbox" name="langs" value="fr" id="pe-langs" data-testid="profile-edit-langs-fr-input"><span data-i18n="profile.lang.fr" data-testid="profile-edit-langs-fr-label"></span></label>
              <label class="choice" data-testid="profile-edit-langs-en-choice"><input type="checkbox" name="langs" value="en" data-testid="profile-edit-langs-en-input"><span data-i18n="profile.lang.en" data-testid="profile-edit-langs-en-label"></span></label>
            </div>
          </fieldset>
          <p class="error-msg" id="pe-langs-error" hidden data-testid="profile-edit-langs-error"></p>
        </div>

        <div class="field" id="pe-f-skills">
          <label class="label" for="pe-skills" data-i18n="profile.edit.skills" data-testid="profile-edit-skills-label"></label>
          <input class="input mono" id="pe-skills" name="skills" type="text" placeholder="go, postgresql" autocomplete="off" data-testid="profile-edit-skills-input">
          <p class="error-msg" id="pe-skills-error" hidden data-testid="profile-edit-skills-error"></p>
        </div>

        <div class="field" id="pe-f-bio">
          <label class="label" for="pe-bio" data-i18n="profile.edit.bio" data-testid="profile-edit-bio-label"></label>
          <textarea class="textarea" id="pe-bio" name="bio" rows="4" data-testid="profile-edit-bio-input"></textarea>
          <p class="error-msg" id="pe-bio-error" hidden data-testid="profile-edit-bio-error"></p>
        </div>

        <div class="field" id="pe-f-biolang">
          <label class="label" for="pe-biolang" data-i18n="profile.edit.biolang" data-testid="profile-edit-biolang-label"></label>
          <select class="select" id="pe-biolang" name="biolang" data-testid="profile-edit-biolang-input">
            <option value="fr" data-i18n="profile.lang.fr" data-testid="profile-edit-biolang-fr"></option>
            <option value="en" data-i18n="profile.lang.en" data-testid="profile-edit-biolang-en"></option>
          </select>
        </div>

        <div class="field" id="pe-f-github">
          <label class="label" for="pe-github" data-i18n="profile.edit.github" data-testid="profile-edit-github-label"></label>
          <input class="input mono" id="pe-github" name="github" type="url" placeholder="https://" inputmode="url" autocomplete="off" data-testid="profile-edit-github-input">
          <p class="error-msg" id="pe-github-error" hidden data-testid="profile-edit-github-error"></p>
        </div>

        <div class="field">
          <label class="choice" data-testid="profile-edit-citypub-choice"><input type="checkbox" id="pe-citypub" name="citypub" aria-describedby="pe-citypub-hint" data-testid="profile-edit-citypub-input"><span data-i18n="profile.edit.citypub" data-testid="profile-edit-citypub-label"></span></label>
          <p class="hint" id="pe-citypub-hint" data-i18n="profile.edit.citypub.hint" data-testid="profile-edit-citypub-hint"></p>
        </div>
      </div>
      <div class="dialog-foot">
        <button type="button" class="btn btn-ghost" data-dialog-close data-i18n="common.cancel" data-testid="profile-edit-cancel"></button>
        <button type="submit" class="btn btn-primary" id="pe-submit" data-testid="profile-edit-submit"><span class="icon i-check" aria-hidden="true" data-testid="profile-edit-submit-icon"></span><span data-i18n="profile.edit.save" data-testid="profile-edit-submit-label"></span></button>
      </div>
    </form>
  </dialog>

  <script src="../assets/js/shell.js"></script>
  <script defer src="../assets/js/app.js"></script>
  <script defer src="../assets/js/i18n-common.js"></script>
  <script defer src="../assets/data/people.js"></script>
  <script defer src="../assets/data/common.js"></script>
  <script defer src="../assets/data/connect.js"></script>
  <script defer src="../assets/js/pages/profile.js"></script>
</body>
</html>
