    SignInRequest:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
          minLength: 3
          maxLength: 254
          format: email
        password:
          type: string
          minLength: 1
          maxLength: 128
          format: password
          writeOnly: true
      additionalProperties: false
    PasswordResetRequest:
      type: object
      required:
      - email
      properties:
        email:
          type: string
          minLength: 3
          maxLength: 254
          format: email
      additionalProperties: false
    PasswordResetConfirm:
      type: object
      required:
      - token
      - new_password
      properties:
        token:
          type: string
          minLength: 16
          maxLength: 256
        new_password:
          type: string
          minLength: 12
          maxLength: 128
          format: password
          writeOnly: true
      additionalProperties: false
    Account:
      type: object
      required:
      - id
      - email
      - email_verified
      - username
      - display_name
      - roles
