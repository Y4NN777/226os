        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: __Host-226os_session
      description: Opaque server-side session (HttpOnly, SameSite=Lax, Secure in deployed envs). Cookie name is `__Host-226os_session`
        in staging-test and production-live, `226os_session` in local-dev (ADR-0003). Idle 2 h, absolute 7 d.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Synchronizer CSRF token from GET /auth/csrf or SessionState (anonymous auth endpoints use the pre-session token
        from GET /auth/csrf plus an Origin/Fetch-Metadata check). Required on every unsafe method
        (POST/PUT/PATCH/DELETE), including JSON and anonymous ones. Missing/wrong -> 403 CSRF_FAILED. Both schemes
        in one requirement object are ANDed.
  headers:
    XRequestId:
      description: Opaque request correlation id.
      schema:
        type: string
        minLength: 1
        maxLength: 64
    IdempotencyReplayed:
      description: Present with the value `true` when this response is the stored response of an earlier request with the same `Idempotency-Key` (a replay), not a new execution.
      schema:
        type: string
        enum: ['true']
    IdempotencyBodyOmitted:
      description: Present with the value `true` on a replay whose stored body did not fit the idempotency store. The status and `Location` are those of the first response; fetch the resource through `Location`.
      schema:
        type: string
        enum: ['true']
    RetryAfter:
      description: Seconds to wait before retrying.
      schema:
        type: integer
        minimum: 0
        maximum: 86400
  parameters:
    QuestionId:
      name: questionId
      in: path
      required: true
      description: questionId (UUID).
      schema:
        $ref: '#/components/schemas/Uuid'
    ResourceId:
      name: resourceId
      in: path
      required: true
      description: resourceId (UUID).
      schema:
        $ref: '#/components/schemas/Uuid'
    ProjectId:
      name: projectId
      in: path
      required: true
      description: projectId (UUID).
      schema:
        $ref: '#/components/schemas/Uuid'
    NeedId:
      name: needId
      in: path
      required: true
      description: needId (UUID).
      schema:
        $ref: '#/components/schemas/Uuid'
    ApplicationId:
      name: applicationId
      in: path
      required: true
      description: applicationId (UUID).
      schema:
        $ref: '#/components/schemas/Uuid'
    ArticleId:
      name: articleId
      in: path
      required: true
      description: articleId (UUID).
      schema:
        $ref: '#/components/schemas/Uuid'
    SeriesId:
      name: seriesId
      in: path
      required: true
      description: seriesId (UUID).
      schema:
        $ref: '#/components/schemas/Uuid'
    LessonId:
      name: lessonId
      in: path
      required: true
      description: lessonId (UUID).
      schema:
        $ref: '#/components/schemas/Uuid'
    Username:
      name: username
      in: path
      required: true
      description: Public username.
      schema:
        $ref: '#/components/schemas/Username'
    Cursor:
      name: cursor
      in: query
      description: Opaque pagination cursor from a previous next_cursor. Tampered/expired -> 400 INVALID_CURSOR.
      schema:
        type: string
        minLength: 1
        maxLength: 512
        pattern: ^[A-Za-z0-9_-]+$
    Limit:
      name: limit
      in: query
      description: Page size, 1..50 (above 50 -> 422).
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    Country:
      name: country
      in: query
      schema:
        $ref: '#/components/schemas/CountryCode'
    LangFilter:
      name: lang
      in: query
      description: Original language of the content.
      schema:
        $ref: '#/components/schemas/Lang'
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: ETag of the representation being edited (412 PRECONDITION_FAILED on mismatch, 428 PRECONDITION_REQUIRED when missing).
      schema:
        type: string
        minLength: 1
        maxLength: 128
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Client-generated unique key (our own convention, inspired by an IETF draft that is not an RFC). Bound server-side to subject
        + route + request hash for 24 hours. Same key + same body replays the stored response;
        same key + different body -> 422 IDEMPOTENCY_KEY_REUSED; concurrent in-flight duplicate -> 409 IDEMPOTENCY_IN_PROGRESS.
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: ^[A-Za-z0-9._~-]+$
  responses:
    BadRequest:
      description: Malformed request (syntax, invalid cursor)
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:226os:problem:MALFORMED_REQUEST
            title: Malformed request (syntax, invalid cursor)
            status: 400
            code: MALFORMED_REQUEST
            request_id: req_01HZX0
            instance: /api/v1/questions
    Unauthorized:
      description: No valid session
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:226os:problem:UNAUTHENTICATED
            title: No valid session
            status: 401
            code: UNAUTHENTICATED
            request_id: req_01HZX0
            instance: /api/v1/questions
    Forbidden:
      description: Authenticated but not permitted, or CSRF check failed
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:226os:problem:FORBIDDEN
            title: Authenticated but not permitted, or CSRF check failed
            status: 403
            code: FORBIDDEN
            request_id: req_01HZX0
            instance: /api/v1/questions
    NotFound:
      description: Absent, or private/non-visible object whose existence must not leak
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:226os:problem:NOT_FOUND
            title: Absent, or private/non-visible object whose existence must not leak
            status: 404
            code: NOT_FOUND
            request_id: req_01HZX0
            instance: /api/v1/questions
    Conflict:
      description: Uniqueness or state conflict, or in-flight idempotent duplicate
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:226os:problem:STATE_CONFLICT
            title: Uniqueness or state conflict, or in-flight idempotent duplicate
            status: 409
            code: STATE_CONFLICT
            request_id: req_01HZX0
            instance: /api/v1/questions
    PreconditionFailed:
      description: If-Match does not match the current ETag
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:226os:problem:PRECONDITION_FAILED
            title: If-Match does not match the current ETag
            status: 412
            code: PRECONDITION_FAILED
            request_id: req_01HZX0
            instance: /api/v1/questions
    PreconditionRequired:
      description: If-Match header is required
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:226os:problem:PRECONDITION_REQUIRED
            title: If-Match header is required
            status: 428
            code: PRECONDITION_REQUIRED
            request_id: req_01HZX0
            instance: /api/v1/questions
    PayloadTooLarge:
      description: Body exceeds the size limit
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:226os:problem:PAYLOAD_TOO_LARGE
            title: Body exceeds the size limit
            status: 413
            code: PAYLOAD_TOO_LARGE
            request_id: req_01HZX0
            instance: /api/v1/questions
    Unprocessable:
      description: Semantic validation failed (violations[] lists fields)
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:226os:problem:VALIDATION_ERROR
            title: Semantic validation failed (violations[] lists fields)
            status: 422
            code: VALIDATION_ERROR
            request_id: req_01HZX0
            instance: /api/v1/questions
    TooManyRequests:
      description: Rate limit exceeded
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:226os:problem:RATE_LIMITED
            title: Rate limit exceeded
            status: 429
            code: RATE_LIMITED
            request_id: req_01HZX0
            instance: /api/v1/questions
    InternalError:
      description: Unexpected server failure (no internals disclosed)
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:226os:problem:INTERNAL_ERROR
            title: Unexpected server failure (no internals disclosed)
            status: 500
            code: INTERNAL_ERROR
            request_id: req_01HZX0
            instance: /api/v1/questions
    ServiceUnavailable:
      description: Dependency unavailable (e.g. GitHub import)
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:226os:problem:SERVICE_UNAVAILABLE
            title: Dependency unavailable (e.g. GitHub import)
            status: 503
            code: SERVICE_UNAVAILABLE
            request_id: req_01HZX0
            instance: /api/v1/questions
  schemas:
    AssistantQuestion:
      type: object
      description: A question for the sourced assistant. Only this text, after redaction of obvious secrets and emails, is sent to the provider.
      required:
      - question
      properties:
        question:
          type: string
          minLength: 3
          maxLength: 1000
        lang:
          $ref: '#/components/schemas/Lang'
      additionalProperties: false
    AssistantSource:
      type: object
      description: A published content item the answer relies on. The server only returns items that belong to the retrieved passages and are visible to the caller.
      required:
      - type
      - id
      - title
      - url
      properties:
        type:
          type: string
          enum:
          - question
          - resource
          - project
          - article
          - series
        id:
          $ref: '#/components/schemas/Uuid'
        title:
          type: string
          minLength: 1
          maxLength: 200
        url:
          type: string
          format: uri-reference
          maxLength: 512
          description: Canonical in-app URL of the cited content.
        published_at:
          oneOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
          description: Publication date when known; null when the source is undated (the answer then states the uncertainty).
      additionalProperties: false
    AssistantAnswer:
      type: object
      description: The assistant reply. Always labelled AI; it is never stored as an answer and cannot be voted or accepted.
      required:
      - outcome
      - generated_by
      - answer
      - sources
      - how_to_verify
      - lang
      properties:
        outcome:
          type: string
          enum:
          - answered
          - no_source
          description: no_source means no published content matched; the provider was not called and search_url points to the search.
        generated_by:
          type: string
          enum:
          - ai
        answer:
          type: string
          maxLength: 4000
          description: Plain text or limited Markdown. No reasoning text, no guarantee about an API, no verified-solution claim.
        sources:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/AssistantSource'
        how_to_verify:
          type: string
          maxLength: 1000
          description: The "Comment vérifier" section that ends every answer.
        search_url:
          type: string
          format: uri-reference
          maxLength: 512
          description: Present when outcome is no_source.
        lang:
          $ref: '#/components/schemas/Lang'
      additionalProperties: false
    ModerationTargetType:
      type: string
      enum:
      - question
      - answer
      - resource
      - project
      - article
      - relation
    ModerationReason:
      type: object
      required:
      - reason
      properties:
        reason:
          type: string
          minLength: 3
          maxLength: 500
      additionalProperties: false
    ErrorReportResolution:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - resolved
          - rejected
        note:
          type: string
          minLength: 0
          maxLength: 500
      additionalProperties: false
    Uuid:
      type: string
      format: uuid
      description: Opaque identifier; never an authorization control.
    Timestamp:
      type: string
      format: date-time
      description: RFC 3339, UTC (suffix Z).
      examples:
      - '2026-11-11T09:30:00Z'
    Lang:
      type: string
      enum:
      - fr
      - en
      description: Language of user content (original language preserved, never auto-translated).
    Slug:
      type: string
      minLength: 1
      maxLength: 64
      pattern: ^[a-z0-9][a-z0-9-]*$
    TagSlug:
      type: string
      minLength: 1
      maxLength: 32
      pattern: ^[a-z0-9][a-z0-9.+#-]*$
    TopicCode:
      type: string
      minLength: 2
      maxLength: 30
      pattern: '^[a-z][a-z0-9-]{1,29}$'
      description: learn_topics.code. Matches the database check learn_topics_code_ck.
      examples:
      - payments
    CountryCode:
      type: string
      minLength: 2
      maxLength: 2
      pattern: ^[A-Z]{2}$
      description: ISO 3166-1 alpha-2.
      examples:
      - BF
    Username:
      type: string
      minLength: 3
      maxLength: 30
      pattern: ^[a-z0-9][a-z0-9_-]{2,29}$
    Markdown:
      type: string
      minLength: 1
      maxLength: 20000
      description: Markdown source. Raw HTML is neutralised on output; code is never executed.
    QuestionState:
      type: string
      enum:
      - open
      - answered
      - resolved
      description: Derived, never stored or client-set. open = no answers; answered = has answers, none accepted; resolved = an accepted answer is set.
    ResourceType:
      type: string
      enum:
      - api
      - sdk
      - tool
      description: What the item is.
    VerificationStatus:
      type: string
      enum:
      - verified
      - claimed
      - unverified
      - stale
      - disputed
    ApplicationStatus:
      type: string
      enum:
      - pending
      - accepted
      - declined
      - withdrawn
    NeedStatus:
      type: string
      enum:
      - open
      - filled
      - closed
    ProjectVisibility:
      type: string
      enum:
      - public
      - private
    ArticleType:
      type: string
      enum:
      - article
      - tutorial
    ArticleStatus:
      type: string
      enum:
      - draft
      - published
      - archived
      - removed
      description: Publication lifecycle. Only published articles are public; drafts are visible to their author.
    Level:
      type: string
      enum:
      - beginner
      - intermediate
      - advanced
    VoteTargetType:
      type: string
      enum:
      - question
      - answer
    SearchGroup:
      type: string
      enum:
      - questions
      - resources
      - projects
      - learn
    FieldVisibility:
      type: string
      enum:
      - public
      - members
      - private
    ProfileVisibility:
      type: string
      description: Who may open this profile page. A new profile defaults to public. On a JSON Merge Patch, omitting the field leaves the stored value unchanged.
      enum:
      - public
      - members
      - private
      default: public
    Intent:
      type: string
      enum:
      - ask
      - help
      - integrate
      - contribute
      - learn
      description: Onboarding intent (values from the prototype welcome step plus learn).
    ProfileField:
      type: string
      enum:
      - intent
      - skills
      - country
      - languages
      - github
      - bio
      - open_to_collab
    ErrorCode:
      type: string
      description: Stable machine code; see x-error-catalogue for the status mapping.
      enum:
      - MALFORMED_REQUEST
      - INVALID_CURSOR
      - UNAUTHENTICATED
      - INVALID_CREDENTIALS
      - CSRF_FAILED
      - FORBIDDEN
      - EMAIL_NOT_VERIFIED
      - SELF_VOTE_FORBIDDEN
      - REAUTH_REQUIRED
      - NOT_FOUND
      - DUPLICATE_APPLICATION
      - DUPLICATE_REVIEW
      - VOTE_CONFLICT
      - IDEMPOTENCY_IN_PROGRESS
      - STATE_CONFLICT
      - PRECONDITION_FAILED
      - PAYLOAD_TOO_LARGE
      - VALIDATION_ERROR
      - INVALID_TOKEN
      - IDEMPOTENCY_KEY_REUSED
      - INVALID_GITHUB_URL
      - PRECONDITION_REQUIRED
      - RATE_LIMITED
      - INTERNAL_ERROR
      - SERVICE_UNAVAILABLE
      - UPSTREAM_UNAVAILABLE
      x-error-catalogue:
        MALFORMED_REQUEST: 400
        INVALID_CURSOR: 400
        UNAUTHENTICATED: 401
        INVALID_CREDENTIALS: 401
        CSRF_FAILED: 403
        FORBIDDEN: 403
        EMAIL_NOT_VERIFIED: 403
        SELF_VOTE_FORBIDDEN: 403
        REAUTH_REQUIRED: 403
        NOT_FOUND: 404
        DUPLICATE_APPLICATION: 409
        DUPLICATE_REVIEW: 409
        VOTE_CONFLICT: 409
        IDEMPOTENCY_IN_PROGRESS: 409
        STATE_CONFLICT: 409
        PRECONDITION_FAILED: 412
        PAYLOAD_TOO_LARGE: 413
        VALIDATION_ERROR: 422
        INVALID_TOKEN: 422
        IDEMPOTENCY_KEY_REUSED: 422
        INVALID_GITHUB_URL: 422
        PRECONDITION_REQUIRED: 428
        RATE_LIMITED: 429
        INTERNAL_ERROR: 500
        SERVICE_UNAVAILABLE: 503
        UPSTREAM_UNAVAILABLE: 503
    Violation:
      type: object
      required:
      - field
      - code
      properties:
        field:
          type: string
          minLength: 1
          maxLength: 128
          description: JSON pointer or query parameter name.
        code:
          type: string
          enum:
          - required
          - too_short
          - too_long
          - invalid_format
          - invalid_value
          - out_of_range
          - too_many_items
          - duplicate
          - unknown_field
      additionalProperties: false
    Problem:
      type: object
      description: RFC 9457 problem details (application/problem+json) plus extension members code, request_id,
        violations. Clients ignore unknown extension members.
      required:
      - type
      - title
      - status
      - code
      - request_id
      properties:
        type:
          type: string
          minLength: 1
          maxLength: 256
          format: uri-reference
          description: Stable identifier of the problem type, `urn:226os:problem:<code>`; an identifier only, not dereferenceable at P0.
          examples:
          - urn:226os:problem:VALIDATION_ERROR
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: Stable per type.
        status:
          type: integer
          minimum: 400
          maximum: 599
          description: Equals the HTTP status.
        detail:
          type: string
          minLength: 0
          maxLength: 500
          description: Human-safe; never SQL, stack traces, tokens, hostnames, or private-object existence.
        instance:
          type: string
          minLength: 0
          maxLength: 512
          description: Request path (no query string secrets).
        code:
          $ref: '#/components/schemas/ErrorCode'
        request_id:
          type: string
          minLength: 1
          maxLength: 64
          description: Opaque correlation id, safe to show to support.
        violations:
          type: array
          items:
            $ref: '#/components/schemas/Violation'
          maxItems: 100
      additionalProperties: true
    Accepted:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - accepted
      additionalProperties: false
    CsrfToken:
      type: object
      required:
      - csrf_token
      properties:
        csrf_token:
          type: string
          minLength: 16
          maxLength: 256
      additionalProperties: false
    TokenRequest:
      type: object
      required:
      - token
      properties:
        token:
          type: string
          minLength: 16
          maxLength: 256
      additionalProperties: false
    SignUpRequest:
      type: object
      required:
      - email
      - password
      - username
      properties:
        email:
          type: string
          minLength: 3
          maxLength: 254
          format: email
        password:
          type: string
          minLength: 12
          maxLength: 128
          format: password
          writeOnly: true
        username:
          $ref: '#/components/schemas/Username'
        display_name:
          type: string
          minLength: 1
          maxLength: 80
        ui_lang:
          $ref: '#/components/schemas/Lang'
