# 226os P0 API contract (OpenAPI 3.1). ACCEPTED (ADR-0004, 2026-11-11). Source of truth for verbs/schemas/status codes;
# narrative in docs/spec-kit/API_CONTRACT.md.
openapi: 3.1.0
info:
  title: 226os P0 API
  version: 1.0.0
  summary: Contract for Solve, Discover, Build, Learn, identity and search.
  description: |-
    Accepted contract (ADR-0004). Source of truth for verbs, schemas and status codes; see docs/spec-kit/API_CONTRACT.md.

    Conventions: base path `/api/v1`; JSON UTF-8; UUID ids; RFC 3339 UTC timestamps; cookie session + `X-CSRF-Token` on every unsafe method (no bearer tokens); errors are RFC 9457 `application/problem+json` with `type` = `urn:226os:problem:<code>`; cursor pagination (`cursor`, `limit` default 20, max 50, above 50 -> 422, envelope `{items, next_cursor}`); `Idempotency-Key` on retried creates (24 h retention); `ETag`/`If-Match` on question edits; user content carries `lang` (fr|en) and is never auto-translated. Status policy: 401 no session; 403 authenticated but not allowed on an object visible to the caller (also CSRF_FAILED, EMAIL_NOT_VERIFIED, SELF_VOTE_FORBIDDEN, REAUTH_REQUIRED); 404 absent or private object whose existence must not leak; 409 duplicate/state conflict; 412/428 precondition; 422 validation; 429 with Retry-After. Publishing needs a verified email. PATCH uses JSON Merge Patch (RFC 7396).

    Extensions: `x-priority` (P0|P1), `x-spec` (US-* refs), `x-authz` (matrix mapping and 403/404 choice).
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
- url: /api/v1
  description: Same-origin API prefix
tags:
- name: auth
  description: Sign-up, sign-in/out, session, email verification, password reset, CSRF token
- name: me
  description: Own account and profile
- name: profiles
  description: Public profiles
- name: questions
  description: 'Solve: questions'
- name: answers
  description: 'Solve: answers and acceptance'
- name: votes
  description: 'Solve: votes'
- name: resources
  description: 'Discover: APIs/tools catalogue, sources, reviews (P1), error reports'
- name: projects
  description: 'Build: projects, contribution needs, applications'
- name: learn
  description: 'Learn: articles, tutorials, training series'
- name: search
  description: Cross-domain search (questions, resources, projects, Learn)
- name: assistant
  description: 'Intelligence: sourced AI assistant (P0, members only, disabled by configuration until integrated)'
- name: moderation
  description: 'Moderator scope at P0: hide/restore content and resolve error reports (audited)'
paths:
  /auth/csrf:
    get:
      operationId: getCsrfToken
      tags:
      - auth
      summary: Obtain a CSRF token
      x-priority: P0
      x-spec:
      - US-IDENTITY-001
      x-authz:
        allow: anonymous|member
        matrix: POST /sessions row (CSRF)
        notes: Safe GET. Token is per session (or per anonymous pre-session cookie); sent back in X-CSRF-Token on
          every unsafe request.
      security: []
      responses:
        '200':
          description: CSRF token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfToken'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/sign-up:
    post:
      operationId: signUp
      tags:
      - auth
      summary: Create an account
      x-priority: P0
      x-spec:
      - US-IDENTITY-001
      x-authz:
        allow: anonymous
        matrix: POST /sessions, registration, reset request
        notes: Generic 202 whether or not the email already exists (no enumeration). Rate-limited by IP and account.
          Verification email sent; reset/verification tokens single-use and hashed.
      security:
      - csrfToken: []
      requestBody:
        required: true
        description: Strict JSON body; unknown fields rejected.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpRequest'
      responses:
        '202':
          description: Accepted; a verification email is sent if the address can be used.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Accepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/sign-in:
    post:
      operationId: signIn
      tags:
      - auth
      summary: Sign in (rotates the session)
      x-priority: P0
      x-spec:
      - US-IDENTITY-001
      x-authz:
        allow: anonymous
        matrix: POST /sessions
        notes: Generic INVALID_CREDENTIALS for unknown email or wrong password (equal timing class). Rotates session
          id; sets HttpOnly cookie; returns a fresh CSRF token. Rate-limited, fail closed.
      security:
      - csrfToken: []
      requestBody:
        required: true
        description: Strict JSON body; unknown fields rejected.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInRequest'
      responses:
        '200':
          description: Signed in. Sets the session cookie.
          headers:
            Set-Cookie:
              description: 'Opaque session cookie: HttpOnly; Secure (deployed); SameSite=Lax; Path=/; no Domain.'
              schema:
                type: string
                maxLength: 512
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionState'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/sign-out:
    post:
      operationId: signOut
      tags:
      - auth
      summary: Sign out (revokes the current session)
      x-priority: P0
      x-spec:
      - US-IDENTITY-001
      x-authz:
        allow: member
        matrix: DELETE /sessions/current
        notes: Revokes only the caller's own session server-side; clears the cookie.
      security:
      - cookieAuth: []
        csrfToken: []
      responses:
        '204':
          description: Signed out.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/session:
    get:
      operationId: getSession
      tags:
      - auth
      summary: Current session state
      x-priority: P0
      x-spec:
      - US-IDENTITY-001
      x-authz:
        allow: anonymous|member
        notes: 'Never 401: anonymous callers receive authenticated=false so the SPA can bootstrap.'
      security:
      - {}
      - cookieAuth: []
      responses:
        '200':
          description: Session state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionState'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/verify-email:
    post:
      operationId: verifyEmail
      tags:
      - auth
      summary: Confirm an email address
      x-priority: P0
      x-spec:
      - US-IDENTITY-001
      x-authz:
        allow: anonymous
        notes: Single-use token (lifetime 24h). Invalid/expired token -> 422 INVALID_TOKEN.
      security:
      - csrfToken: []
      requestBody:
        required: true
        description: Strict JSON body; unknown fields rejected.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
      responses:
        '204':
          description: Email verified.
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/password-reset/request:
    post:
      operationId: requestPasswordReset
      tags:
      - auth
      summary: Request a password reset email
      x-priority: P0
      x-spec:
      - US-IDENTITY-001
      x-authz:
        allow: anonymous
        matrix: POST /sessions, registration, reset request
        notes: Always 202 (no enumeration); rate-limited per IP and account.
      security:
      - csrfToken: []
      requestBody:
        required: true
        description: Strict JSON body; unknown fields rejected.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '202':
          description: Accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Accepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/password-reset/confirm:
    post:
      operationId: confirmPasswordReset
      tags:
      - auth
      summary: Set a new password with a reset token
      x-priority: P0
      x-spec:
      - US-IDENTITY-001
      x-authz:
        allow: anonymous
        notes: Single-use token (lifetime 30 min). Revokes all existing sessions of the user.
      security:
      - csrfToken: []
      requestBody:
        required: true
        description: Strict JSON body; unknown fields rejected.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
      responses:
        '204':
          description: Password changed; all sessions revoked.
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /me:
    get:
      operationId: getMe
      tags:
      - me
      summary: Current account and own profile
      x-priority: P0
      x-spec:
      - US-IDENTITY-001
      x-authz:
        allow: member
        matrix: GET /users/me
        notes: Subject from session only. Only place the account email is returned.
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Account and profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /me/profile:
    patch:
      operationId: updateMyProfile
      tags:
      - me
      summary: Update own profile (JSON Merge Patch)
      description: 'Partial update with JSON Merge Patch semantics (RFC 7396): omitted fields are unchanged; `null`
        clears a nullable field. Content type is application/json.'
      x-priority: P0
      x-spec:
      - US-IDENTITY-001
      x-authz:
        allow: member (own profile only)
        matrix: PATCH /profiles/me
        notes: No user id in path or body; cross-user access impossible by construction.
      security:
      - cookieAuth: []
        csrfToken: []
      requestBody:
        required: true
        description: Strict JSON body; unknown fields rejected.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdate'
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /profiles/{username}:
    get:
      operationId: getProfile
      tags:
      - profiles
      summary: Public profile by username
      x-priority: P0
      x-spec:
      - US-IDENTITY-001
      x-authz:
        allow: anonymous|member
        matrix: GET /profiles/{id}
        deny_status:
          private_profile: 404
        notes: Fields are filtered by the owner's field_visibility and the caller (anonymous vs member). Email is
          never returned.
      security:
      - {}
      - cookieAuth: []
      parameters:
      - $ref: '#/components/parameters/Username'
      responses:
        '200':
          description: Visibility-filtered profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicProfile'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /questions:
    get:
      operationId: listQuestions
      tags:
      - questions
      summary: List/search questions
      x-priority: P0
      x-spec:
      - US-SOLVE-001
      - US-IDENTITY-001
      x-authz:
        allow: anonymous|member
        matrix: GET /search, public questions
        notes: 'Only published questions. Order: newest first, UUID tie-breaker (relevance rank first when q is
          set).'
      security: []
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      - name: q
        in: query
        description: Full-text query (bounded length).
        schema:
          type: string
          minLength: 1
          maxLength: 200
      - name: tag
        in: query
        schema:
          $ref: '#/components/schemas/TagSlug'
      - name: state
        in: query
        description: Derived solve state.
        schema:
          $ref: '#/components/schemas/QuestionState'
      - $ref: '#/components/parameters/Country'
      - $ref: '#/components/parameters/LangFilter'
      responses:
        '200':
          description: Page of questions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createQuestion
      tags:
      - questions
      summary: Publish a question
      x-priority: P0
      x-spec:
      - US-SOLVE-001
      x-authz:
        allow: member
        matrix: POST /questions
        notes: author = session subject. Snippets are stored, never executed; Markdown sanitised on output.
      security:
      - cookieAuth: []
        csrfToken: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        description: Strict JSON body; unknown fields rejected.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuestionCreate'
      responses:
        '201':
          description: Created
          headers:
            Location:
              description: Canonical URL of the created resource.
              schema:
                type: string
                format: uri-reference
                maxLength: 512
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
            Idempotency-Body-Omitted:
              $ref: '#/components/headers/IdempotencyBodyOmitted'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Question'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /questions/{questionId}:
    get:
      operationId: getQuestion
      tags:
      - questions
      summary: Get a question with its context links
      x-priority: P0
      x-spec:
      - US-SOLVE-001
      - US-IDENTITY-001
      x-authz:
        allow: anonymous|member
        notes: 404 for unknown or non-published (non-visible) questions.
      security: []
      parameters:
      - $ref: '#/components/parameters/QuestionId'
      responses:
        '200':
          description: Question
          headers:
            ETag:
              description: Entity tag; send it back in If-Match when editing.
              schema:
                type: string
                maxLength: 128
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Question'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      operationId: updateQuestion
      tags:
      - questions
      summary: Edit own question (JSON Merge Patch)
      x-priority: P0
      x-spec:
      - US-SOLVE-001
      x-authz:
        allow: owner
        matrix: PATCH/DELETE /questions/{id}
        non_owner: 403
        notes: Visible object, not the author -> 403 (owner-confirmed). Moderator edits only via documented moderation
          policy (not in this API yet).
      security:
      - cookieAuth: []
        csrfToken: []
      parameters:
      - $ref: '#/components/parameters/QuestionId'
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        description: Strict JSON body; unknown fields rejected.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuestionUpdate'
      responses:
        '200':
          description: Updated
          headers:
            ETag:
              description: Entity tag of the updated question.
              schema:
                type: string
                maxLength: 128
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Question'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /questions/{questionId}/answers:
    get:
      operationId: listAnswers
      tags:
      - answers
      summary: List answers of a question
      x-priority: P0
      x-spec:
      - US-SOLVE-001
      x-authz:
        allow: anonymous|member
        notes: 'Order: accepted first, then vote_score desc, created_at, id.'
      security: []
      parameters:
      - $ref: '#/components/parameters/QuestionId'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of answers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnswerPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createAnswer
      tags:
      - answers
      summary: Answer a question
      x-priority: P0
      x-spec:
      - US-SOLVE-001
      x-authz:
        allow: member
        matrix: POST /questions/{id}/answers
        notes: Question must be visible. Requires a verified email (403 EMAIL_NOT_VERIFIED).
      security:
      - cookieAuth: []
        csrfToken: []
      parameters:
      - $ref: '#/components/parameters/QuestionId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        description: Strict JSON body; unknown fields rejected.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnswerCreate'
      responses:
        '201':
          description: Created
          headers:
            Location:
              description: Canonical URL of the created resource.
              schema:
                type: string
                format: uri-reference
                maxLength: 512
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
            Idempotency-Body-Omitted:
              $ref: '#/components/headers/IdempotencyBodyOmitted'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Answer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /votes:
    post:
      operationId: castVote
      tags:
      - votes
      summary: Cast or change a vote (idempotent per user and target)
      description: 409 VOTE_CONFLICT only when a concurrent conflicting write for the same (user, target) is in
        flight; sequential repeats are idempotent 200s.
      x-priority: P0
      x-spec:
      - US-SOLVE-001
      x-authz:
        allow: member
        matrix: POST /votes
        notes: 'Unique (user, target_type, target_id). Repeating the same value is a no-op returning the same state;
          changing value updates it. Counters are server-derived. Voting on your own question or answer -> 403 SELF_VOTE_FORBIDDEN (service rule). Up (+1) and down (-1) votes are both allowed.'
      security:
      - cookieAuth: []
        csrfToken: []
      requestBody:
        required: true
        description: Strict JSON body; unknown fields rejected.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoteRequest'
      responses:
        '200':
          description: Current vote state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoteState'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: retractVote
      tags:
      - votes
      summary: Retract own vote
      x-priority: P0
      x-spec:
      - US-SOLVE-001
      x-authz:
        allow: member
        matrix: POST /votes / DELETE /votes
        notes: 'Idempotent: no existing vote -> 200 with value 0.'
      security:
      - cookieAuth: []
        csrfToken: []
      parameters:
      - name: target_type
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/VoteTargetType'
      - name: target_id
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          description: Vote state after retraction
          content:
            application/json:
              schema:
