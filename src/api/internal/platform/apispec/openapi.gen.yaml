        github:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 39
            pattern: ^[A-Za-z0-9](?:[A-Za-z0-9-]{0,37}[A-Za-z0-9])?$
            description: GitHub username.
          - type: 'null'
        bio:
          type:
          - string
          - 'null'
          maxLength: 500
        open_to_collab:
          type: boolean
        field_visibility:
          type: object
