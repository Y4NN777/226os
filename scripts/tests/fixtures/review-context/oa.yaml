openapi: 3.1.0
components:
  schemas:
    ProfileUpdate:
      type: object
      properties:
        languages:
          type: array
          items:
            type: string
            minLength: 2
            pattern: ^[a-z]{2,3}(-[A-Za-z0-9]{2,4})?$
        github:
          type: string
          pattern: ^[A-Za-z0-9-]{1,39}$
