version: "2"
run:
  timeout: 5m
linters:
  default: standard
  enable:
    - errorlint
    - bodyclose
    - noctx
    - depguard
  settings:
    depguard:
      rules:
        module-boundaries:
          files: ["**/internal/!(platform|app)/**/*.go"]
          deny:
            - pkg: github.com/Y4NN777/226os/apps/api/internal/app
              desc: modules must not import the composition root
