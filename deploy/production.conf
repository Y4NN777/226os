# Non-secret deploy settings of the `production` environment (read by scripts/deploy-conf.sh from the commit being
# deployed, so a change goes through a pull request). KEY=value only: no quotes, no spaces around =, nothing evaluated.
# The two secrets (DEPLOY_SSH_KEY, SOPS_AGE_KEY) stay in the GitHub environment. Guide: docs/runbooks/deploy-setup.md.
#
# Fill the two FILL-ME values after the server bootstrap (scripts/server-bootstrap.sh prints both). The deploy job
# fails with "fill deploy/production.conf" while one remains.

# The server, exactly as in DEPLOY_KNOWN_HOSTS below (IP address or DNS name).
DEPLOY_HOST=226os.tech
DEPLOY_USER=deploy
# Must equal PUBLIC_HOST in secrets/production-live.enc.env.
PUBLIC_HOST=226os.tech
# PUBLIC host key line of the server (no secret): <DEPLOY_HOST> ssh-ed25519 <key>
DEPLOY_KNOWN_HOSTS=226os.tech ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDG0ZyVf+DMK6+T0euJm1xAG441Caj03r09G1ZQ0QOEd
