# local-dev routes (plain HTTP, loopback only). No host rule: the entrypoint is bound to 127.0.0.1.
http:
  routers:
    api:
      rule: "PathPrefix(`/api/`) || Path(`/healthz`)"
      entryPoints: [web]
      service: api
      priority: 100
    web:
      rule: "PathPrefix(`/`)"
      entryPoints: [web]
      service: web
      priority: 1
  services:
    api:
      loadBalancer:
        servers:
          - url: http://api:8080
    web:
      loadBalancer:
        servers:
          - url: http://web:8080
